 Raise (holding a post)", "Arm travelling out to the SIDE with tension as low in the range as possible. Lean-away version mimics the cable's bottom-range tension."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Incline DB Press", "Low-Incline Barbell / Smith Press", "Incline Machine Press", "Low-to-high Cable Fly + Press hybrid", "~30° incline pressing for UPPER chest. Flat bench is the last resort - it shifts mass low on the torso, away from the taper."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Overhead Cable Triceps Ext.", "Two-hand DB Overhead Extension (seated)", "EZ-bar Skullcrusher lowered BEHIND the head", "Cross-body / incline DB overhead extension", "Elbows overhead or near it, deep stretch behind the head - the lengthened long-head position IS the exercise (Maeo 2022). A pushdown is NOT a valid sub for this slot."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Smith Squat (feet forward)", "Leg Press (feet low and narrow)", "Front Squat (or Back Squat)", "Goblet Squat, heels raised on plates", "Deep knee bend with a quad stretch and an upright torso. Front squat is the best free-weight sub; do it at slot 3, not slot 5, if you swap it in."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Dips (chest-leaning)", "Assisted Dip Machine", "Close-Grip Bench Press", "Flat / Decline DB Press", "Compound press with heavy triceps involvement through a deep stretch. Close-grip bench is the best barbell stand-in."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Cable Rope Pushdown", "Straight-bar Pushdown", "Single-arm Cable Pushdown", "Triceps Extension Machine", "Elbow-pinned extension in the shortened range - complements the overhead slot. Any pushdown handle works; the elbows staying pinned is the contract."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "sec", "x": "PULL EXERCISES"}, {"t": "row", "v": ["Weighted Pull-up / Wide Pulldown", "Lat Pulldown (any wide/overhand handle)", "Assisted Pull-up Machine", "Single-arm Kneeling Cable Pulldown", "Vertical pull, full overhead stretch at the top, elbows driving DOWN. All four are the same exercise to your lats."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["DB Chest-Supported Row", "T-bar Row with chest pad / Seal Row", "Machine Row (chest pad)", "Single-arm DB Row, free hand braced on bench", "Horizontal row with the torso SUPPORTED so the lower back isn't the limiter. Bent-over barbell row is a distant last resort - it spends recovery on erectors."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Cable Lat Pullover", "DB Pullover (lying across a bench)", "Machine Pullover", "High-cable Straight-arm Pulldown (same family)", "Nearly-straight arms, big stretch under the armpit at the top. If you feel the armpit stretch, the sub is working."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Neutral-Grip Lat Pulldown", "Neutral-grip Pull-up", "Wide Pulldown (rotate grips)", "Single-arm Cable Pulldown", "Vertical pull, different grip from the week's other one - the variety is the point, so just pick any handle you didn't use Tuesday."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Seated Cable Row (wide)", "Machine Row (wide grip)", "Chest-Supported DB Row", "T-bar Row", "Horizontal pull to the upper abdomen with a hard blade squeeze."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Face Pull", "Reverse Pec Deck", "Rear-Delt DB Fly, chest on incline bench", "Band Pull-apart (high reps)", "Rear delt + external rotation, light and strict. All three subs are fully interchangeable with the original."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "sec", "x": "ARM EXERCISES"}, {"t": "row", "v": ["Incline DB Curl", "Bayesian Cable Curl (arm behind body, facing away)", "Seated Curl on a reclined bench (~60°)", "Standing DB Curl, elbows deliberately drifted back", "Arm BEHIND the torso line, biceps stretched at the bottom. A preacher curl is NOT a sub for this slot - it's the opposite length bias."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Hammer Curl", "Rope Cable Hammer Curl", "Cross-body Hammer Curl", "Reverse-grip EZ Curl", "Neutral (or pronated) grip so the brachialis and forearm lead. Grip orientation is the contract, implement is irrelevant."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "sec", "x": "LEG EXERCISES"}, {"t": "row", "v": ["Romanian Deadlift", "DB Romanian Deadlift", "Seated Leg Curl", "45° Back Extension (glute/ham bias)", "Hamstrings loaded at LONG length. Seated leg curl surprisingly qualifies - hip flexion puts the hamstrings in a lengthened position at the knee. Conventional deadlift is a strength choice, not a sub (see chat: worst hypertrophy-per-fatigue ratio)."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Leg Press", "Smith Squat (feet forward)", "Smith Squat, feet forward", "Goblet Squat (high reps) or Belt Squat", "High-volume quad work you can take near failure without spinal or balance cost."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Bulgarian Split Squat", "Walking Lunge", "Reverse Lunge", "Step-up (knee-height box) / Single-leg Press", "Unilateral knee-dominant pattern through a long ROM. Any lunge variant honours it."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}]}, {"n": "Subs by Day", "b": [{"t": "note", "x": "Rule: preserve the MOVEMENT PATTERN and the muscle's LENGTHENED position, not the specific machine. Sub 1 is near-identical; Sub 2 is solid; Sub 3 is the 'busy-gym emergency' option. Log the substitute in your Tracking Log notes - loads don't transfer between variations, so track them separately. Same sets × reps × RIR as the original."}, {"t": "sec", "x": "MONDAY - PUSH A"}, {"t": "row", "v": ["Overhead Press (BB)", "Seated DB Shoulder Press - same pattern, easier to grab a bench than a rack", "Machine Shoulder Press - fixed path, fine stimulus, fast setup", "Single-arm DB Press (standing) - always available, one DB needed", "Preserve: vertical press. Any of these keeps delts + fractional triceps. Avoid subbing with lateral raises - that loses the heavy pressing slot."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Cable Lateral Raise", "DB Lateral Raise - the classic; slightly less bottom-range tension, otherwise equal", "Machine Lateral Raise - excellent if your gym has one; consistent resistance", "Single-arm DB raise leaning away from a post ('lean-away raise') - mimics the cable's stretched-position tension with just one DB", "Preserve: side-arc raise to shoulder height. This slot must NEVER be skipped - it's priority #1 and needs only one dumbbell, so there's always an option."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Incline DB Press", "Low-Incline Barbell Bench (15–30°) - same upper-chest bias, micro-loadable", "Incline Machine / Smith Press - fixed path, totally fine", "Flat DB Press with a deliberate full stretch - loses some upper-chest bias, keeps the press", "Preserve: pressing with upper-chest bias (incline angle). If everything incline is taken, flat + deep stretch beats waiting 10 minutes."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Overhead Cable Triceps Ext", "Overhead DB Extension (single DB, two hands, seated) - identical long-head stretch", "EZ-bar Skullcrusher to BEHIND the head - lowering behind the head restores the lengthened position", "Close-grip push-up with hips high / bench dips - emergency only, less long-head bias", "Preserve: elbows overhead / arm-behind-torso stretch. A pushdown is NOT a good sub here - it trains the shortened position and loses the Maeo advantage."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Smith Squat (feet forward)", "Leg Press (feet low & narrow) - nearly interchangeable for quads", "Smith Machine Squat (feet slightly forward) - replicates the upright-torso quad bias", "Front Squat or Goblet Squat - free-weight options; goblet for lighter days, front squat if you enjoy barbell work", "Preserve: deep knee flexion with an upright torso. Any of the four grows quads; pick by availability and preference."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "sec", "x": "TUESDAY - PULL A"}, {"t": "row", "v": ["Weighted Pull-up / Wide Pulldown", "Lat Pulldown (any wide/overhand handle) - the direct equivalent", "Assisted Pull-up Machine - same pattern, adjustable load", "Single-arm Cable Pulldown (kneeling) - only needs one free cable", "Preserve: vertical pull, elbows driving down. Between pull-up and pulldown, treat them as the same exercise at different loads."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["DB Chest-Supported Row", "Single-arm DB Row (hand and knee on a flat bench) - same row, the bench keeps the lower back out of it", "T-Bar Row with chest pad - same support, same pattern", "Single-arm DB Row (knee on bench) - loses the strict pad but keeps the row; brace hard", "Preserve: horizontal row without lower-back load. The incline-bench DB version is available in literally every gym."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Cable Lat Pullover", "DB Pullover (lying across a bench) - the original; slightly less even tension, same stretch", "Machine Pullover - S-tier if your gym has one", "Straight-arm Rope Pulldown standing tall - same movement, more upright", "Preserve: arms-overhead lat stretch with near-straight arms. The armpit-stretch feel check tells you if the sub is working."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Incline DB Curl", "Bayesian Cable Curl (facing away from low cable, arm behind torso) - same lengthened position, arguably equal or better", "Seated DB Curl leaning BACK against any upright bench - improvised incline", "Standing DB/EZ Curl with strict elbows pinned slightly BACK - partial lengthened bias", "Preserve: arm behind the torso line at the bottom. A preacher curl is NOT a sub - it's the opposite (shortened-biased) position."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Romanian Deadlift", "DB Romanian Deadlift - identical hinge, dumbbells instead of a bar", "45° Back Extension holding a plate (hips high, round nothing) - hinge pattern, hamstring/glute stretch", "Seated or Lying Leg Curl - loses glutes but is the best pure hamstring machine; fine for a day", "Preserve: hip hinge with hamstring stretch. If the leg curl is the sub, add nothing - glutes get enough from the week's squatting."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "sec", "x": "THURSDAY - PUSH B"}, {"t": "row", "v": ["Seated DB Shoulder Press", "Machine Shoulder Press - direct swap", "Standing Barbell/DB OHP - you already know it from Monday", "Landmine Press (bar in a corner) - shoulder-friendly angle, always free", "Preserve: vertical press. Interchange freely with Monday's press variations - just log which one you did."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["DB Lateral Raise", "Cable Lateral Raise - straight swap with Monday's version", "Machine Lateral Raise", "Lean-away single-DB raise - see Monday note", "Never skippable - one dumbbell is always free somewhere."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Dips (chest-leaning)", "Assisted Dip Machine - same movement, adjustable", "Decline or Flat Barbell/DB Press - horizontal press + heavy triceps, the classic stand-in (this is where FLAT BENCH fits the programme if you want it)", "Deep Push-ups on handles/DBs - bodyweight emergency, add a backpack for load", "Preserve: deep press with chest stretch + hard lockout. Flat bench is a legitimate first-choice swap here if you prefer barbells."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Cable Rope Pushdown", "Straight-bar or V-bar Pushdown - same thing, different handle", "Single-arm Cable Pushdown - only needs one free pulley", "DB Kickbacks (strict, torso parallel) - weakest option but preserves the shortened-position work", "Preserve: elbow-pinned extension. Any cable handle works - the handle matters far less than the pinned elbows."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Leg Press", "Smith Squat (feet forward) - interchangeable with Monday's slot; just don't do the same one on both days", "Smith Squat (feet forward) or Goblet/Front Squat", "DB Bulgarian Split Squat (extra sets) - turn Friday's exercise into today's volume", "Preserve: knee-dominant quad work you can push safely. Rotating hack↔leg press across the week is completely fine."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "sec", "x": "FRIDAY - PULL B"}, {"t": "row", "v": ["Neutral-Grip Lat Pulldown", "Any pulldown handle (wide, underhand, V-grip) - grip variety is a bonus, not a requirement", "Pull-ups (neutral or any grip)", "Single-arm kneeling cable pulldown", "Preserve: vertical pull. Identical logic to Tuesday's slot."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Seated Cable Row (wide)", "DB Chest-Supported Row / T-Bar - swap with Tuesday's variation", "Machine Row (any) - high row for extra upper-back bias", "Single-arm DB Row", "Preserve: horizontal row. Vary handles freely; log which."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Face Pull", "Reverse Pec Deck - arguably the better rear-delt tool anyway; treat as co-first-choice", "Bent-over DB Reverse Fly (chest on incline bench) - needs only light DBs", "Band Pull-aparts - keep a band in your gym bag and this slot becomes unskippable", "Preserve: horizontal pull-apart for rear delts + scap retraction. Light weight, high reps, perfect squeeze."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Hammer Curl", "Rope Hammer Curl (low cable) - same neutral grip, constant tension", "Cross-body Hammer Curl (DB across to opposite chest) - strong brachialis bias", "Reverse-grip EZ Curl - shifts to brachioradialis/forearms, still on-mission", "Preserve: neutral or pronated grip curl. Any of these keeps the brachialis/forearm target."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "row", "v": ["Bulgarian Split Squat", "Walking DB Lunges - same unilateral pattern, no bench needed", "Reverse Lunges (DB or Smith) - knee-friendliest lunge variant", "Step-ups on a box/bench - emergency option, keep the trailing leg passive", "Preserve: unilateral knee-dominant work with a stretch. Any lunge pattern qualifies."], "h": ["Programme exercise", "Substitute 1 (best)", "Substitute 2", "Substitute 3 (emergency)", "What to preserve / notes"]}, {"t": "sec", "x": "WHERE THE BIG BARBELL LIFTS FIT (if you want them)"}, {"t": "row", "v": ["Flat Bench Press", "Best home: Thursday, replacing Dips (like-for-like horizontal press + heavy triceps). Or run low-incline BB instead of Monday's incline DBs.", "Redundant rather than harmful - flat benching biases mid/lower pec, which does little for the taper. Fine as a preference."]}, {"t": "row", "v": ["Front Squat", "Best home: swap for Smith Squat (Mon) or Leg Press (Thu). Move to slot 3 that day - don't front squat exhausted.", "More upright and quad-biased than back squat; usually limited by upper-back/wrist position, not quads."]}, {"t": "row", "v": ["Back Squat", "Same slots as front squat. Slot 3, not slot 5.", "Good lift, worse quad-per-fatigue ratio than the machines. A preference swap, not an upgrade."]}, {"t": "row", "v": ["Conventional Deadlift", "If you must: Tuesday, replacing RDL - cap at 2–3 sets × 3–5 reps @ 2–3 RIR.", "Least efficient for physique: huge fatigue, mostly isometric back work, and builds erectors/upper traps that don't help the taper. A strength choice, not a physique one."]}]}, {"n": "No-Gym Bodyweight", "b": [{"t": "note", "x": "Why this works: hypertrophy is similar across a wide load range when sets are taken close to failure - even ~30% of max load grows muscle if pushed hard (Schoenfeld load meta-analyses). So the rules change: NO fixed rep targets - every work set goes to 0–1 RIR. Slow 3-second lowering on everything. Progress by adding reps, then by making the exercise harder (deficit, lever, single-limb), not by adding weight. Missed a Push day → do BW Push. Missed a Pull day → do BW Pull. Log it in the Tracking Log like any session (write 'BW' in the load column)."}, {"t": "sec", "x": "BW PUSH - replaces Monday or Thursday  ·  all sets to 0–1 RIR"}, {"t": "row", "v": ["1", "Pike Push-up", "4", "Overhead / DB Shoulder Press", "Hips high in an inverted V, hands shoulder-width, lower the CROWN of your head to the floor between your hands, press back up. Harder: feet on a chair (more vertical = more delt). Hardest: wall handstand push-up. You should feel it in the shoulders, not the chest."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["2", "Deficit Push-up", "4", "Incline DB Press / Dips", "Hands on two stacks of books or chairs so your chest sinks BELOW hand level - the deep stretch is the point. Slight downward-slope of body (feet a bit elevated) biases upper chest. Harder: more deficit, feet higher, backpack with books on your back."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["3", "Bodyweight Skullcrusher", "3–4", "Overhead Cable Triceps Extension", "Hands on a table/counter/sturdy chair edge, body straight, bend ONLY the elbows so your head dips below your hands, then press back to straight arms. The lower the surface, the harder. Deep stretch behind the arms = the long head working - this genuinely honours the overhead slot's contract."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["4", "Improvised-Load Lateral Raise", "3–4", "Cable / DB Lateral Raise", "Fill two bottles or bags (water, books). Strict form from the Form Guide, 15–30 reps to a real burn. Light load is FINE here - lateral raises are light in the gym anyway; failure is what matters. No load at all? Side-lying single-arm raises (lying on your side, top arm raises) make even nothing feel like something."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["5", "Sissy Squat (assisted) or Split Squat", "3/leg", "Smith Squat / Leg Press", "Sissy: hold a doorframe, rise onto toes, let knees travel far forward as you lean back and lower - a huge quad stretch; the closest bodyweight gets to a hack squat. Easier alternative: rear-foot-elevated split squats off the sofa, 3s down, to failure per leg."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "sec", "x": "BW PULL - replaces Tuesday or Friday  ·  all sets to 0–1 RIR"}, {"t": "row", "v": ["1", "Pull-up (bar) / Towel Door Row / Table Row", "4", "Pull-up / Lat Pulldown", "Best: doorframe pull-up bar. No bar: (a) Towel row - towel over a sturdy door top or wrapped round a post, lean way back, pull chest to hands. (b) Table row - lie under a solid table, grab the edge, pull chest to it, body straight. Harder: feet elevated, slower negatives, one-arm towel rows. Same cue as the gym: elbows down and in, stretch at the bottom."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["2", "Single-arm Backpack Row", "3–4", "DB Chest-Supported Row / Cable Row", "Load a backpack with books, brace your free hand on a chair, row the bag to your hip with a 1s squeeze at the top. Slow negatives; 15–25 reps to failure per side. Grip the straps low to stop the bag swinging."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["3", "Prone Y-Raise + Rear-Delt Raise", "3", "Face Pull / Reverse Pec Deck", "Lie face-down (floor or bed edge). Y-raise: arms overhead in a Y, thumbs up, lift off the floor, squeeze the lower traps, 2s hold. Then rear-delt raise: arms out in a T with small bottles, lift and squeeze. These feel light - that's normal; the muscles are small. Chase the squeeze, not the load."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["4", "Backpack Curl (behind-body bias)", "3", "Incline / Hammer Curl", "Hold the loaded backpack by the top handle (neutral grip = hammer bias). Stand with the arm slightly BEHIND your torso line against a wall to mimic the incline curl's stretch. Slow negatives, to failure. Alternate which grip you use across the week."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "row", "v": ["5", "Nordic Curl Negatives or Single-leg RDL", "3", "Romanian Deadlift", "Nordic: kneel with feet anchored under the sofa, lower your body forward as SLOWLY as possible using hamstrings, catch yourself, push back up. Brutally effective lengthened hamstring work - arguably better than most gym options. Easier: single-leg RDL holding the backpack, hamstring-stretch depth rule from the Form Guide."], "h": ["#", "Exercise", "Sets", "Replaces (gym slot)", "How to do it + make it hard enough"]}, {"t": "sec", "x": "WORTH £25 - equipment that transforms home days"}, {"t": "row", "v": ["Doorframe pull-up bar (~£15–25)", "The single biggest upgrade - turns BW Pull from improvisation into a real lat session. If you buy one thing, buy this."]}, {"t": "row", "v": ["Resistance band set (~£10–15)", "Adds face pulls, band lateral raises, pushdowns, curls, pull-aparts - covers every isolation the bodyweight day struggles with. Travels in a suitcase."]}, {"t": "row", "v": ["The honest hierarchy", "Gym session > home session with bar+bands > pure bodyweight session > skipped session. Every tier still counts. Consistency is the programme."]}]}, {"n": "8-Week Plan", "b": [{"t": "row", "v": ["1–2", "2–3 RIR", "2–3 RIR", "Establish baselines. Pick loads hitting the BOTTOM of each rep range at ~2–3 RIR. Groove technique, log everything."], "h": ["Weeks", "Isolations (raises, curls, extensions, face pulls)", "Heavy compounds (OHP, pull-up, Smith squat, RDL)", "Focus / notes"]}, {"t": "row", "v": ["3–5", "1–2 RIR", "1–2 RIR", "Double progression running: top of range on all sets → add smallest increment, drop to bottom of range."], "h": ["Weeks", "Isolations (raises, curls, extensions, face pulls)", "Heavy compounds (OHP, pull-up, Smith squat, RDL)", "Focus / notes"]}, {"t": "row", "v": ["4", "-", "-", "Optional: +1 set on lateral raises if recovering well (priority muscle, tolerates volume)."], "h": ["Weeks", "Isolations (raises, curls, extensions, face pulls)", "Heavy compounds (OHP, pull-up, Smith squat, RDL)", "Focus / notes"]}, {"t": "row", "v": ["6–8", "0–1 RIR on last set", "1–2 RIR (keep a rep back)", "Push isolations to (or 1 rep from) failure - closer to failure = more growth (Robinson 2024). Compounds stay conservative for joints/recovery."], "h": ["Weeks", "Isolations (raises, curls, extensions, face pulls)", "Heavy compounds (OHP, pull-up, Smith squat, RDL)", "Focus / notes"]}, {"t": "row", "v": ["7", "-", "-", "Optional: +1 more set on lateral raises if week-4 addition was recovered well."], "h": ["Weeks", "Isolations (raises, curls, extensions, face pulls)", "Heavy compounds (OHP, pull-up, Smith squat, RDL)", "Focus / notes"]}, {"t": "row", "v": ["9 (deload)", "Cut sets ~40–50%, moderate loads", "Same", "Shed fatigue, then restart the cycle at week 1 with your new, higher baselines. Don't skip it."], "h": ["Weeks", "Isolations (raises, curls, extensions, face pulls)", "Heavy compounds (OHP, pull-up, Smith squat, RDL)", "Focus / notes"]}, {"t": "note", "x": "Stall rule: if a lift stalls two sessions running at the same RIR, deload that movement or rotate the variation."}]}, {"n": "Guide", "b": [{"t": "sec", "x": "KEY CONCEPTS"}, {"t": "row", "v": ["RIR (reps in reserve)", "How many reps you could still do when you stop the set. 2 RIR = stopped 2 reps short of failure. Hypertrophy improves as you get closer to failure (Robinson et al. 2024) - isolations get pushed hardest."]}, {"t": "row", "v": ["Double progression", "Work inside the rep range. When you hit the TOP of the range on ALL sets at the target RIR, add the smallest load increment next session and drop back to the BOTTOM of the range."]}, {"t": "row", "v": ["Fractional volume", "Indirect work counts ~half a set toward a muscle (Pelland et al. 2026). Your pulls build biceps/rear delts, your presses build triceps - arms hit their dose largely for free."]}, {"t": "row", "v": ["Lengthened-position bias", "Training at long muscle lengths is at least as effective as full ROM, often better (Wolf et al. 2023/2025). Hence incline curls, overhead extensions, pullovers, RDLs - always chase the stretch."]}, {"t": "row", "v": ["Weekly dose targets", "~4 direct sets/muscle/week is the growth floor; 5–10 sets/week captures most of the gains (Pelland 2026). Every priority muscle here sits in that window."]}, {"t": "sec", "x": "TOP 3 HIGHEST-IMPACT (ranked)"}, {"t": "row", "v": ["1. Lateral Raise (Mon+Thu)", "Highest side-delt EMG of any shoulder exercise; pressing builds the FRONT delt, not width. The cap that sets the widest point of your frame."]}, {"t": "row", "v": ["2. Vertical Pull (Tue+Fri)", "Pull-ups/pulldowns build the lats = the flare = the lower half of the V. S-tier in Nippard's evidence-based rankings."]}, {"t": "row", "v": ["3. Overhead Triceps Extension (Mon)", "Triceps = ~2/3 of arm mass. Overhead (lengthened) extensions grew triceps ~40% more than pushdowns, MRI-measured (Maeo et al. 2022)."]}, {"t": "sec", "x": "WEAK LINKS (silent V-taper killers)"}, {"t": "row", "v": ["Rear delts", "Without them delts look flat and posture rounds forward, visually narrowing you. → Face pulls (Fri) + every row."]}, {"t": "row", "v": ["Lower/mid traps", "Weak scapular control = shoulders roll forward = kills the wide look. → Face pulls, chest-supported rows, pullovers."]}, {"t": "row", "v": ["Brachialis", "Sits under the biceps and pushes it up; arm width from the side. → Hammer curls (Fri)."]}, {"t": "row", "v": ["Forearms", "Thin forearms undercut the arm. → Hammer curls + grip work from pulls."]}, {"t": "row", "v": ["Serratus anterior", "Scapular positioning that lets you open the frame. → Pullovers."]}, {"t": "row", "v": ["The waist", "V-taper is a RATIO. Skip heavy weighted oblique/side work - oblique thickness works against the taper. Bracing on compounds is enough."]}, {"t": "sec", "x": "LEG LOGIC (time-to-muscle-return)"}, {"t": "row", "v": ["Smith Squat, feet forward (Mon)", "Stands in for the hack squat, which your gym does not have. Feet forward keeps the torso upright, so the quads take the load with a deep knee bend and a big quad stretch, and the bar path is fixed, so balance and the lower back are not the limit."]}, {"t": "row", "v": ["Romanian Deadlift (Tue)", "Hamstrings at long muscle length + glutes + erectors in one slot. Keep 1–2 RIR."]}, {"t": "row", "v": ["Leg Press (Thu)", "Back-supported, balance-free - accumulate quad volume and safely train to failure with near-zero systemic cost."]}, {"t": "row", "v": ["Bulgarian Split Squat (Fri)", "Unilateral, long ROM, fixes imbalances, builds glutes. Light absolute load = no spinal fatigue into the weekend."]}, {"t": "row", "v": ["Why no leg day", "A leg day = 5 slots + a recovery window for a secondary goal. One leg compound per day gives ~6–8 quad + ~5 posterior sets/week - enough to grow - without ever crowding upper work."]}, {"t": "sec", "x": "SOURCES"}, {"t": "row", "v": ["Pelland et al. 2026, Sports Medicine", "Volume/frequency dose-response; fractional sets. ~4 sets/wk floor, 5–10 optimal zone."]}, {"t": "row", "v": ["Robinson et al. 2024, Sports Medicine", "Proximity-to-failure meta-regression: hypertrophy rises as sets approach failure; strength largely insensitive."]}, {"t": "row", "v": ["Wolf et al. 2023 / 2025 (PeerJ)", "Lengthened partials / long-muscle-length training at least equal to full ROM. (Dissent: Brookbush review argues effect is overstated.)"]}, {"t": "row", "v": ["Maeo et al. 2022, Eur J Sport Sci", "Overhead vs neutral triceps extensions, MRI: ~1.4× growth advantage overhead."]}, {"t": "row", "v": ["Kassiano et al. 2025; Zabaleta-Korta 2023", "Incline vs preacher curls - lengthened incline favours proximal biceps growth."]}, {"t": "row", "v": ["Boeckh-Behrens & Buskies 2000; Schoenfeld", "Lateral raise = highest lateral-delt EMG; regional hypertrophy requires regional stimulation."]}, {"t": "row", "v": ["Jeff Nippard", "Evidence-based back exercise rankings: vertical pulls, chest-supported rows, pullovers top-tier."]}]}, {"n": "2-3-5 Day Variants", "b": [{"t": "note", "x": "Rule that makes all variants work: weekly volume per muscle matters more than how many days it's spread across (Pelland 2026). All progression rules, RIR waves, form cues and rest times from the other tabs apply unchanged. Exercise numbering = running order."}, {"t": "sec", "x": "2 DAYS / WEEK - Full Body ×2 (e.g., Mon + Thu)  ·  ~60–75 min/session"}, {"t": "note", "x": "Honest expectation: 2 days is enough to GROW, but slowly - think 'best possible return on minimal time', not maximal gains. Compensations: 4 sets per exercise (recovery is abundant at this frequency, so each session works harder), every exercise is a compound or a top-3 priority move, and only the highest-leverage isolations survive. Leave at least 2 days between sessions."}, {"t": "sec", "x": "DAY 1 - Full Body A"}, {"t": "row", "v": ["1", "Overhead Press", "4 × 5–8", "Front delt, triceps / upper chest", "Heaviest press; delts + heavy fractional triceps in one slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Weighted Pull-up / Wide Pulldown", "4 × 6–10", "Lats / biceps, mid-back", "The width move; fractional biceps volume"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Cable Lateral Raise", "4 × 12–18", "LATERAL DELT", "Priority #1 - never gets cut at any frequency"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Overhead Cable Triceps Extension", "4 × 10–15", "Triceps (long head)", "The single best arm-mass slot (Maeo 2022)"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Smith Squat (feet forward)", "3 × 8–12", "Quads / glutes", "One quad compound covers the lower half"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 2 - Full Body B"}, {"t": "row", "v": ["1", "Incline DB Press", "4 × 8–12", "Upper chest, front delt / triceps", "Frame width up high + fractional triceps"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "DB Chest-Supported Row", "4 × 8–12", "Mid-back, lats / rear delt, biceps", "Thickness + rear delt + fractional biceps, zero lower-back cost"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "DB Lateral Raise", "4 × 12–18", "LATERAL DELT", "Second weekly exposure on the priority"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Incline DB Curl", "4 × 8–12", "Biceps (long head) / brachialis", "The one direct biceps slot - lengthened, highest return"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Romanian Deadlift", "3 × 8–10", "Hamstrings, glutes / erectors", "One hinge covers the whole posterior chain"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "note", "x": "Weekly effective volume: lateral delts 8 direct · lats ~4 direct + row fractional ≈ 6 · triceps 4 direct + press fractional ≈ 8 · biceps 4 direct + pull fractional ≈ 7 · quads 3 / posterior 3 (maintenance-plus). What got cut and why: pullovers, face pulls, hammer curls, second leg slots - the compounds' fractional volume covers rear delts, brachialis and forearms well enough at this frequency."}, {"t": "sec", "x": "3 DAYS / WEEK - Push / Pull / Upper-Hybrid (e.g., Mon · Wed · Fri)  ·  ~55–65 min/session"}, {"t": "note", "x": "The sweet-spot fallback: research shows ~90% of the 4-day result if weekly sets are kept similar. Structure: a push day, a pull day, then a hybrid day that gives the V-taper muscles (delts + lats) their second weekly hit. One leg slot per day, as in the 4-day."}, {"t": "sec", "x": "DAY 1 - Push"}, {"t": "row", "v": ["1", "Overhead Press", "3 × 5–8", "Front delt, triceps / upper chest", "Heavy pressing base"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Cable Lateral Raise", "3 × 12–18", "LATERAL DELT", "Priority width slot #1"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Dips (chest-leaning)", "3 × 8–12", "Chest, triceps / front delt", "Chest + heavy triceps in one compound"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Overhead Cable Triceps Extension", "3 × 10–15", "Triceps (long head)", "Direct long-head slot (Maeo 2022)"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Smith Squat (feet forward)", "3 × 8–12", "Quads / glutes", "Quad slot #1"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 2 - Pull"}, {"t": "row", "v": ["1", "Weighted Pull-up / Wide Pulldown", "3 × 6–10", "Lats / biceps", "Width slot #1"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "DB Chest-Supported Row", "3 × 8–12", "Mid-back, lats / rear delt, biceps", "Thickness + rear delt"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Cable Lat Pullover", "3 × 12–15", "Lats (stretched)", "Lengthened lat isolation - the sweep"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Incline DB Curl", "3 × 8–12", "Biceps (long head) / brachialis", "Direct biceps slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Romanian Deadlift", "3 × 8–10", "Hamstrings, glutes / erectors", "Posterior-chain slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 3 - Upper Hybrid (width emphasis)"}, {"t": "row", "v": ["1", "Incline DB Press", "3 × 8–12", "Upper chest, front delt / triceps", "Second press exposure + fractional triceps"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Neutral-Grip Lat Pulldown", "3 × 10–14", "Lats / biceps", "Second vertical pull - width from a new angle"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "DB Lateral Raise", "3 × 12–18", "LATERAL DELT", "Priority width slot #2"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Face Pull", "3 × 15–20", "Rear delt / lower+mid traps", "The weak-link slot - posture that displays the width"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Leg Press", "3 × 12–20", "Quads / glutes", "Quad slot #2, near-zero systemic cost"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "note", "x": "Weekly effective volume: lateral delts 6 · lats 9 direct · triceps 3 direct + heavy fractional ≈ 7 · biceps 3 direct + fractional ≈ 6–7 · rear delt 3 + row fractional · quads 6 / posterior 3. Cuts vs 4-day: hammer curls and the pushdown (fractional pressing covers triceps; pulls cover brachialis/forearms) and one leg slot."}, {"t": "sec", "x": "5 DAYS / WEEK - Push / Pull / Legs+Width / Push / Pull (e.g., Mon–Fri)  ·  ~45–60 min/session"}, {"t": "note", "x": "Only choose this if sleep, food and recovery genuinely support it - beyond ~10 sets/muscle/week the returns diminish (Pelland 2026), so day 5 buys polish (weak links, a 3rd delt exposure, calves), not a new tier of growth. Upper days lose their leg slot - legs get their own focused day mid-week - so each upper session is 5 pure upper slots."}, {"t": "sec", "x": "DAY 1 (Mon) - Push A"}, {"t": "row", "v": ["1", "Overhead Press", "3 × 5–8", "Front delt, triceps / upper chest", "Heavy pressing base"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Cable Lateral Raise", "3 × 12–18", "LATERAL DELT", "Width exposure 1 of 3"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Incline DB Press", "3 × 8–12", "Upper chest, front delt / triceps", "Upper-chest frame width"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Overhead Cable Triceps Extension", "3 × 10–15", "Triceps (long head)", "Long-head slot (Maeo 2022)"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Cable Fly (low-to-high)", "3 × 12–15", "Upper chest", "Stretch-position chest finisher - earns the freed slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 2 (Tue) - Pull A"}, {"t": "row", "v": ["1", "Weighted Pull-up / Wide Pulldown", "3 × 6–10", "Lats / biceps", "Width slot #1"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "DB Chest-Supported Row", "3 × 8–12", "Mid-back, lats / rear delt, biceps", "Thickness"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Cable Lat Pullover", "3 × 12–15", "Lats (stretched)", "The sweep"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Incline DB Curl", "3 × 8–12", "Biceps (long head)", "Lengthened biceps slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Face Pull", "3 × 15–20", "Rear delt / lower+mid traps", "Weak-link slot, exposure 1 of 2"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 3 (Wed) - Legs + Width top-up"}, {"t": "row", "v": ["1", "Smith Squat (feet forward)", "3 × 8–12", "Quads / glutes", "Main quad slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Romanian Deadlift", "3 × 8–10", "Hamstrings, glutes", "Posterior chain"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Bulgarian Split Squat", "2 × 10–12/leg", "Quads, glutes", "Unilateral + imbalances"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "DB Lateral Raise", "3 × 12–18", "LATERAL DELT", "Width exposure 2 of 3 - small muscle, recovers fast"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Standing Calf Raise", "3 × 10–15", "Calves", "5-day bonus the 4-day couldn't afford; full stretch at the bottom"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 4 (Thu) - Push B"}, {"t": "row", "v": ["1", "Seated DB Shoulder Press", "3 × 8–12", "Front + lateral delt / triceps", "Second press, more lateral bias"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Cable or DB Lateral Raise", "3 × 12–18", "LATERAL DELT", "Width exposure 3 of 3"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Dips (chest-leaning)", "3 × 8–12", "Chest, triceps", "Compound triceps loading"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Cable Rope Pushdown", "3 × 12–15", "Triceps (lateral/medial)", "Covers the heads overhead work misses"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Reverse Pec Deck", "3 × 15–20", "Rear delt", "Weak-link exposure 2 of 2 - 3D shoulders"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "sec", "x": "DAY 5 (Fri) - Pull B"}, {"t": "row", "v": ["1", "Neutral-Grip Lat Pulldown", "3 × 10–14", "Lats / biceps", "Width from a second angle"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["2", "Seated Cable Row (wide)", "3 × 10–14", "Mid-back, rear delt", "Upper-back thickness"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["3", "Bayesian / Cable Curl", "3 × 10–14", "Biceps (long head)", "Second lengthened biceps slot"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["4", "Hammer Curl", "3 × 10–14", "Brachialis, brachioradialis", "Arm width from the side + forearms"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "row", "v": ["5", "Cable Lat Pullover", "3 × 12–15", "Lats (stretched)", "Optional 2nd pullover - or swap for Leg Press if quads feel undertrained"], "h": ["#", "Exercise", "Sets × Reps", "Primary / Secondary", "Why it's here"]}, {"t": "note", "x": "Weekly effective volume: lateral delts 9 (3 exposures - fine, they recover in ~48h) · lats 12 direct (a touch past the sweet spot; acknowledged diminishing returns, they're the priority) · triceps 6 direct + fractional ≈ 10 · biceps 9 + fractional · rear delt 6 · quads 5–8 · posterior 4–5 · calves 3. Note: no shrugs anywhere by design - overbuilt upper traps visually slope the shoulders and narrow the taper."}, {"t": "sec", "x": "WHICH TO CHOOSE"}, {"t": "row", "v": ["2-day", "Life is chaotic / travel-heavy. Keeps everything and grows slowly. ~2.5h/week total."]}, {"t": "row", "v": ["3-day", "The best value-per-session option - roughly 90% of the 4-day result. Default fallback in a busy period."]}, {"t": "row", "v": ["4-day (main programme)", "The sweet spot for your goals: every priority at optimal volume, sane sessions, two full rest days + weekend."]}, {"t": "row", "v": ["5-day", "Only when sleep and food are dialled in. Buys weak-link polish and a 3rd delt hit, not a new tier of growth. Drop back to 4 the moment recovery slips."]}]}];
var FG=[["Overhead Press", "SETUP: Bar at upper-chest height in the rack. Grip just outside shoulders, forearms vertical under the bar. Bar rests on the heel of the palm, wrists straight. Feet hip-width, glutes and abs squeezed hard (this is your 'belt').\nEXECUTION: Big breath, brace, press the bar up and slightly BACK so it finishes over the back of your head - push your head 'through the window' once the bar passes your face. Lock out with biceps by your ears. Lower under control to collarbone level.", "FEEL CHECKS: At lockout, the bar should feel WEIGHTLESS and balanced over your mid-foot - if you have to fight it forward, it's drifting. Your glutes should be burning slightly from the squeeze. Shoulders and upper chest do the pushing; the first thing to fatigue should be your delts, then triceps. You should feel your ribs stay DOWN (abs on), not flared up.", "RED FLAGS: Lower-back pinch or arching feeling = you're leaning back to cheat, drop the weight. Bar path scraping way in front of your face = it will feel heavy at lockout. Wrist ache = bar sitting in fingers, not palm heel."], ["Cable Lateral Raise", "SETUP: Pulley at the LOWEST setting (ankle level). Cable at the LOWEST setting (or ankle height), stand side-on, handle in the far hand so the cable runs across your body. Slight lean away from the stack, holding the frame with the free hand.\nEXECUTION: Lead with the ELBOW, raise the arm out to the side in an arc until the elbow reaches shoulder height. Elbow stays slightly bent and always HIGHER than the wrist - pour-the-jug tilt. Lower over 2 full seconds all the way across your body for the deep stretch.", "FEEL CHECKS: Tension should be there from the very BOTTOM of the rep (that's the whole point of the cable). The burn should live on the SIDE cap of the shoulder - touch it between sets; it should be pumped and warm. Reps 12–18 should genuinely burn there. Your neck and traps should feel quiet - do a shrug after the set: if your traps feel pre-cooked, they were stealing the work.", "RED FLAGS: Feeling it on the FRONT of the shoulder = arm drifting forward, keep it in line with your torso. Shoulder-joint pinch at the top = raise only to shoulder height, not above, and keep the pinky-down tilt gentle. Needing a swing/hip bump to start each rep = too heavy."], ["Incline DB Press", "SETUP (chest not firing? see Setup Answers tab): Bench at 30 degrees. Pin shoulder blades BACK and DOWN and keep them there. Bench at 30° (usually the first or second incline notch - NOT 45°, which shifts to front delts). Dumbbells on knees, kick them up one at a time as you lie back. Shoulder blades pulled back and down, pinned to the bench. Slight arch, feet planted.\nEXECUTION: Lower the DBs to the OUTSIDE of your upper chest, elbows ~45° from your torso (not flared to 90°). Deep stretch at the bottom - DBs roughly level with your chest. Press up and slightly together without clanking them.", "FEEL CHECKS: The stretch at the bottom should be felt ACROSS your upper chest, like the muscle is being pulled wide. Squeeze test: at the top, you should be able to feel your upper pecs contract hard (tap them with a free rep after the set). Shoulder blades should stay pinched the whole set - if you feel them 'un-pin' and roll forward at the bottom, reset. Chest fatigues first, then front delts and triceps.", "RED FLAGS: Front-of-shoulder soreness dominating = bench too steep or elbows flaring. Wobbling/uneven pressing = one side weaker - that's fine, but stop the set when the weak side breaks form. Bottom of the rep feels pinchy in the shoulder = shorten the depth slightly."], ["Overhead Cable Triceps Extension", "SETUP: Low pulley, back to the stack, split stance, torso hinged 30-45 degrees, upper arms by the ears. Rope on a low-to-mid pulley. Grab the rope, turn away from the stack, and step forward into a staggered stance, leaning your torso ~30° forward. Elbows up beside your ears, pointing away from the stack, hands behind your head.\nEXECUTION: Keeping the UPPER ARMS FROZEN in place, extend the forearms until arms are straight, then let the weight pull your hands slowly back behind your head into a deep stretch. The elbows never drop or flare - only the forearm hinges.", "FEEL CHECKS: The stretch behind your head is everything - each rep should feel like a genuine PULL down the back of your upper arm (that's the long head lengthening). At lockout, the back of the arm should cramp-squeeze. Place your free moments on it: the meaty inner-back portion of the upper arm should pump up. If your elbows stay pinned, you'll feel work ONLY behind the arm - nowhere else.", "RED FLAGS: Feeling it in the shoulders or lats = elbows drifting down as you get tired; reset them high. Elbow-joint ache (not muscle) = ease the depth of the stretch and warm up with a light set of 20. Torso swinging forward-back to move the weight = too heavy."], ["Smith Squat (feet forward)", "SETUP: Bar at mid-chest height, safety stops just below your bottom position. Bar on the muscle of the upper traps, not the neck. Feet 20-30 cm in front of the bar, shoulder-width, toes slightly out.\nEXECUTION: Unhook, brace, lower for 2-3 seconds until thighs are at least parallel. Knees travel forward over the toes, heels stay down. Drive up through mid-foot, stop just short of locked knees.", "FEEL CHECKS: Stretch down the front of the thighs at the bottom, quads burning by the last reps. Weight spread over the whole foot. Your back leans into the bar like a backrest; your hands only steady it and never lift.", "RED FLAGS: Heels lifting = move the feet a little further forward. Arms working = too heavy or feet too far forward. Lower-back pressure = hips tucking under at the bottom, cut the depth slightly."], ["Weighted Pull-up / Wide Lat Pulldown", "SETUP: Grip just outside shoulder width, palms forward. Start from a DEAD HANG - arms fully straight, shoulders unshrugged (pull the shoulder blades slightly down first: 'proud chest, long neck').\nEXECUTION: Think 'drive the ELBOWS down into my back pockets', not 'pull with the hands'. Chest travels up toward the bar, slight lean back. Top = chin over bar (or bar to upper chest on pulldown). Lower over 2–3 seconds to a full hang every rep.", "FEEL CHECKS: THE key check: before rep 1, do the scapular set (blades down) - you should feel the sides of your back, under the armpits, switch ON. That tension should stay all set. After the set, the sore/pumped zone should be the outer back 'wings', not the arms. Grip a lat with the opposite hand mid-set if unsure - it should be rock hard. Full-hang check: at the bottom you should feel a stretch along the whole side of your back.", "RED FLAGS: Biceps and forearms failing before your back = you're arm-pulling; slow down and re-cue the elbows. Shoulders riding up by your ears at the bottom = you've lost the scapular set. Kipping/swinging = reduce added weight or switch to pulldowns until strict reps are there."], ["DB Chest-Supported Row (incline bench)", "SETUP: Incline bench at 30-45 degrees. Lie face down, chest at the top edge of the pad, chin just over it. Balls of the feet planted behind you. DBs hang straight down, palms facing each other.\nEXECUTION: Pull the elbows back toward the hips, about 45 degrees from the body (elbows to back pockets). Squeeze the blades for 1 second, lower for 2 seconds, let the blades spread at the bottom.", "FEEL CHECKS: The pad is your form checker: if your chest lifts off it, you cheated. Mid-back and rear shoulders tire first, biceps only assist. Stretch across the mid-back at the bottom of every rep.", "RED FLAGS: DBs hitting the bench frame = raise the incline a notch. Biceps failing first = you are pulling with the hands, drag the elbows instead. Benches all taken = single-arm DB row, hand and knee on a flat bench, back flat."], ["Cable Lat Pullover", "SETUP: Rope or straight bar on the HIGH pulley. Face the stack, step back a metre, hinge your torso ~30–45° forward, arms extended up toward the pulley. Soft elbows, fixed for the whole set.\nEXECUTION: With arms nearly straight, pull the attachment DOWN in an arc to your thighs using only the shoulders - like doing a swimming pull. Return slowly, letting the weight pull your arms overhead until you feel a deep stretch under the armpits.", "FEEL CHECKS: This is the easiest lat exercise to verify by feel: at the top you MUST feel a stretch running from your armpit down the side of your ribs. If you feel that stretch, you're doing it right - full stop. At the bottom, squeeze your upper arms against your sides; the 'wing' under the armpit should be contracting hard. Zero biceps involvement - arms are rigid levers.", "RED FLAGS: Feeling it in the triceps = elbows are bending and straightening; lock the elbow angle. Feeling it in the lower back = you're heaving with the torso; the torso angle stays frozen, only the arms move. No armpit stretch at the top = step further from the stack."], ["Incline DB Curl", "SETUP: Bench at ~45–55°. Sit back fully, head and upper back ON the bench, dumbbells hanging straight down at your sides - arms BEHIND your torso line. This hang is the whole point.\nEXECUTION: Curl both DBs up WITHOUT letting the elbows drift forward - they stay pointing at the floor. Squeeze at the top (hands end up roughly shoulder height, not at your shoulders). Lower over 2–3 seconds to a complete dead hang and a strong biceps stretch.", "FEEL CHECKS: Bottom position check: you should feel a distinct STRETCH down the front of the upper arm at the dead hang - if there's no stretch, your elbows have crept forward. Keep your upper arms brushing the bench edge / your torso as a physical position reference you can feel. Biceps should burn deep and high (near the shoulder end) - that's the lengthened long-head work, exactly what we paid for.", "RED FLAGS: Shoulder-front ache = elbows drifting up/forward as you fatigue; end the set. Head lifting off the bench and shoulders rolling = you're heaving; drop 2kg. No stretch feeling at the bottom = check the bench angle isn't too upright."], ["Romanian Deadlift", "SETUP (form breaking with weight? do the two-week hinge regression on the Setup Answers tab first): Bar (or DBs) at hip height. Grip just outside thighs. Stand tall, feet hip-width, knees SOFT (slightly bent, then frozen at that bend). Shoulders back, chest proud.\nEXECUTION: Push your HIPS straight BACK as if closing a car door with your bum - the bar slides down your thighs, staying in contact with your legs the whole way. Torso hinges forward with a FLAT back. Stop at mid-shin or when your hamstrings say stop. Drive hips forward to stand, squeezing glutes at the top.", "FEEL CHECKS: The rep is governed by one sensation: hamstring stretch. Lower ONLY until you feel a strong pull down the back of your thighs, then reverse - that's your depth, wherever it lands. Bar-on-legs check: if the bar loses contact with your thighs/shins, you'll feel the lower back load up instantly - that's your cue it drifted. Flat-back check: your chest stays 'proud' and you could balance a cup on your lower back. Next-day soreness should be hamstrings and glutes, NOT lower back.", "RED FLAGS: Lower-back pump/ache during the set = back rounding or bar drifting away; reduce depth and weight. Feeling it in the knees/quads = knees are bending as you lower (that's a squat, not a hinge); freeze the knee angle."], ["Seated DB Shoulder Press", "SETUP: Seat at 75-85 degrees (one notch back from upright). Bench upright (or one notch back). DBs kicked up to shoulder height, palms forward or slightly turned in, forearms vertical under the DBs. Back against the pad, feet planted, ribs down.\nEXECUTION: Press both DBs up and very slightly together to a full lockout overhead - biceps near ears. Lower under control until the DBs are level with your ears/upper jaw (a bit below is fine if the shoulders are happy).", "FEEL CHECKS: Forearm-vertical check by feel: the DB should feel BALANCED on the stacked forearm, not tipping - any tipping means the elbow isn't under the wrist. At the bottom you should feel mild stretch across the shoulders; at the top, delts squeezing. The pad tells you about cheating: if your lower back peels off it, you're arching to press - you'll feel the gap.", "RED FLAGS: Lower-back arch (gap behind you) = weight too heavy. Pinchy joint feeling at the bottom = don't lower as deep; stay just below ear level. One DB always lagging = start every set with the weaker side's pace."], ["DB Lateral Raise", "SETUP: DBs at your sides, slight forward hinge (~10–15°), soft elbows, pinky side of the DB tilted very slightly down ('pouring water').\nEXECUTION: Raise both arms out to the SIDE in a wide arc, leading with the elbows, to shoulder height. Pause a beat. Lower over 2 full seconds - the lowering is half the exercise.", "FEEL CHECKS: Same target check as the cable version: side-cap burn, quiet traps. A trick that works blind: before the set, actively push your shoulder blades DOWN (as if putting them in your back pockets) and keep them there - traps physically can't shrug if the blades stay down, and you'll feel it if they try. The last 3–4 reps should burn on the outside of the shoulder specifically.", "RED FLAGS: DBs swinging and torso bouncing = too heavy - lateral raises respond to strictness, not load; going lighter GROWS the delts faster here. Neck tightening = shrugging; re-set blades down. Wrists above elbows at the top = you're lifting the hands, not the elbows."], ["Dips (chest-leaning)", "SETUP - INJURY RULE: never below upper-arms-parallel; rebuild on the assisted machine first (Setup Answers tab). Bars roughly shoulder-width. Jump to a straight-arm support, then LEAN the torso forward ~20–30° and let the shins drift back/knees bend - the lean is what shifts work to the chest.\nEXECUTION: Bend the elbows and lower until your upper arms are about parallel to the floor / you feel a solid chest stretch. Elbows track back and slightly out, not flared wide. Press back up to a hard lockout - the lockout is the triceps' moment.", "FEEL CHECKS: Depth by feel: descend until you feel the stretch across the LOWER CHEST - that's parallel, stop there. Lean check: if you feel the work in your chest, you're leaning enough; if it's all triceps and front shoulder, your torso has gone vertical - nose over the floor in front of the bars, feet behind you. Shoulder check at the bottom: no pinching in the front of the shoulder; if there is, cut depth by an inch.", "RED FLAGS: Sternum click or front-shoulder pinch = too deep or elbows flared; shorten ROM. Shaking/uncontrolled descent = do slow negatives or use the assisted dip machine until 8 clean reps. Swinging legs = cross the ankles and squeeze glutes."], ["Cable Rope Pushdown", "SETUP: Rope on the TOP pulley setting. Rope on the high pulley. Stand a half-step back, slight forward lean, elbows PINNED to your sides - imagine a £20 note trapped between each elbow and your ribs for the whole set.\nEXECUTION: Push the rope down until arms are fully straight, spreading the rope ends apart at the bottom and squeezing for a beat. Let the forearms rise under control until they're a bit above parallel - elbows never move from your sides.", "FEEL CHECKS: The pinned elbows ARE the feel-check: you can literally feel whether the elbow has stayed glued to your ribs. Full-lockout squeeze: at the bottom, the horseshoe on the OUTER upper arm should contract hard - tap it with the other hand on your last rep; it should be solid. Only the forearms should feel like they're moving.", "RED FLAGS: Shoulders rounding forward and torso crunching down = you're using bodyweight; lighten the stack. Elbows drifting forward on the way down = the lats/shoulders are helping; that's the £20 note falling. Wrist ache = grip the rope with wrists straight, not curled."], ["Leg Press", "SETUP: Sit fully back in the seat, LOWER BACK and hips glued to the pad. Feet on the platform slightly lower than centre, shoulder-width, toes a touch out.\nEXECUTION: Lower the platform under control until the knees reach roughly 90° or a touch deeper - stopping the moment your hips start to lift or tuck. Press through the whole foot to just short of locked knees. Never slam into lockout.", "FEEL CHECKS: The tailbone rule is your blind depth gauge: the instant you feel your bum start to peel or tuck off the pad, that's YOUR bottom - memorise that depth. Quad stretch at the bottom, quad burn on the way up, especially above the knees. Whole-foot pressure - if your heels float you'll feel the pressure move to the balls of your feet (bad for the knees).", "RED FLAGS: Lower-back pressure at depth = going too deep for your hips; shorten ROM. Knees caving in (pressure rolling to inside foot edge) = push the knees out over the toes. Locking out hard with a jolt = keep a soft knee at the top; tension stays on the quads anyway."], ["Neutral-Grip Lat Pulldown", "SETUP: Neutral (palms-facing) handles or V-grip attachment. Knees snug under the pad, arms fully extended overhead, slight lean back (~15°), chest up.\nEXECUTION: Set the blades down first, then drive the elbows down toward your hips, pulling the handle to the top of your chest. Squeeze, then let the weight pull your arms all the way overhead - feel your shoulder blades rise and the lats stretch at the top of every rep.", "FEEL CHECKS: Identical verification to Tuesday's pull-up: armpit-line tension on, arms as hooks. Top-of-rep stretch check: each rep should END with that pulled-taut feeling down the sides of your back - if reps start feeling 'short', you've stopped going all the way up. The lean stays fixed - if you feel yourself rowing backward for the last reps, the stack is too heavy.", "RED FLAGS: Forearm pump ending the set = death-gripping; hook the fingers, relax the thumbs (or use straps). Bar pulled to the stomach = you've turned it into a row; it should land at the collarbone/upper chest. Bouncing the stack = no stretch happening at the top."], ["Seated Cable Row (wide)", "SETUP: Sit so the stack is already lifted a few cm at full arm stretch. Wide bar or long handle. Feet on the plate, knees soft. Sit TALL - torso vertical, chest proud. Arms extended, feeling a stretch in the mid-back before rep one.\nEXECUTION: Pull the bar WIDE to the upper abdomen/lower chest, elbows out at ~45–60°, squeezing the blades together hard at the back. Return slowly, letting the blades slide apart and the torso stay vertical (a few degrees of natural sway max).", "FEEL CHECKS: Vertical-torso check by feel: your torso angle at the START and END of each rep should be identical - if you notice yourself further back after 5 reps, you're leaning. Squeeze check: 1-second blade pinch every rep; you should be able to hold a pencil between your shoulder blades at the back. Mid/upper back fatigues; rear shoulders join in; biceps are passengers.", "RED FLAGS: Lower back tiring first = torso heaving; reduce weight, sit taller. Shoulders rolling forward at the stretch = fine, but don't let the LOWER back round with them. Jerky yanks off the stack = pull with a smooth 1s tempo."], ["Face Pull", "SETUP: Rope at UPPER-CHEST-to-eye height. Grab the rope ends with thumbs pointing back toward you (underhand-ish). Step back into a split stance until the stack is lifted.\nEXECUTION: Pull the rope toward your EYES/forehead, elbows high and wide, splitting the rope ends apart so your hands finish beside your ears - end position looks like a double-biceps pose. Pause 1s. Return slowly.", "FEEL CHECKS: End-position self-test: at the peak, your knuckles should be beside your EARS and you should feel a squeeze BETWEEN and BELOW the shoulder blades plus the back of the shoulders. If the pull lands at your chin/chest, you'll feel it in the biceps instead - that's the tell. This should never feel 'heavy' - it should feel like a controlled squeeze. Go lighter than pride wants.", "RED FLAGS: Biceps doing the work = pulling with hands low; raise the elbows and think 'pull apart', not 'pull back'. Leaning back to move the stack = too heavy. Neck jutting forward to meet the rope = keep the head still, bring the rope to YOU."], ["Hammer Curl", "SETUP: DBs at your sides, palms facing your thighs (neutral) and staying neutral throughout. Stand tall, elbows lightly touching your sides.\nEXECUTION: Curl the DB up in an arc to shoulder height, thumb leading, elbow staying put by your side. Squeeze, lower over 2s to a full hang. Alternate arms or both together.", "FEEL CHECKS: The elbow-on-ribs contact is your form sensor - you can feel it drift if it happens. The pump should sit LOWER and more outside than a normal curl: the outer upper arm (brachialis, between biceps and triceps) and the top of the forearm should thicken up. Grip the working arm with the free hand mid-set: the muscle just outside the biceps should be hard.", "RED FLAGS: Elbows swinging forward turning it into a front raise = lighter weight. Body rocking to start reps = brace the glutes or do them seated. Wrist curling inward at the top = keep the wrist dead straight, thumb up."], ["Bulgarian Split Squat", "SETUP: Rear foot laces-down on a bench, front foot a LONG stride ahead (you'll adjust - see feel check). DBs at your sides or one goblet-style. Slight forward torso lean.\nEXECUTION: Lower straight down until the rear knee nearly touches the floor and you feel a deep stretch in the front thigh/glute. Drive up through the FRONT heel/mid-foot. All reps one side, then switch - always start with the weaker leg.", "FEEL CHECKS: Stride-length calibration by feel: if you feel it mostly in the front QUAD and your front heel wants to lift, the stance is too short. If you feel a big GLUTE/hip stretch and the heel stays heavy, you've found the long stride we want. Balance is a feature: wobbling means the stabilisers are working; it should improve week to week - that's measurable progress you can feel. Front leg does ~80% of the work; the back leg is a kickstand.", "RED FLAGS: Rear-hip-flexor pinch (front of the back leg's hip) = rear foot too high or stride too short. Front-knee pain = knee diving inward; feel for pressure on the inside edge of the foot and push the knee out. Using the back leg to spring up = keep it passive."]];

var libIdx=0;
function fmtT(s){return esc(s).replace(/\n/g,"<br>").replace(/(^|<br>)([A-Z][A-Z \-&']{2,}:)/g,"$1<b>$2</b>")}
function libRow(b){
  var v=b.v,h=b.h,html='<div class="lcard">',start=1,t;
  if(h){
    if(h[0]==="#"){t=(v[0]?v[0]+". ":"")+v[1];start=2}else{t=v[0]}
    html+='<h3>'+fmtT(t)+'</h3>';
    for(var i=start;i<v.length;i++){ if(!v[i])continue;
      html+='<p>'+(h[i]?'<i>'+esc(h[i])+'</i>':'')+fmtT(v[i])+'</p>'}
  }else{
    html+=(v.length>1?'<h3>'+fmtT(v[0])+'</h3>':'<p>'+fmtT(v[0])+'</p>');
    for(var j=1;j<v.length;j++) html+='<p>'+fmtT(v[j])+'</p>';
  }
  return html+'</div>';
}

}

function fullForm(d,i){

         '<span class="fld"><input class="num" inputmode="numeric" placeholder="" value="'+esc(rp)+'" data-f="'+i+"_"+s+'_rp"><u>reps</u></span>'+

}

  '<p>It sets your weight for you. Pick a load that lands you inside the rep range at the target RIR for the week, so a hard day simply means a lighter weight and the log stays honest.</p>'+

  '<div class="card"><h3>Rest</h3>'+
  '<p><b>Between sets.</b> Compounds, meaning presses, pull-ups, rows, squats and RDLs: 2-3 minutes. Isolations, meaning raises, curls, extensions and face pulls: 1.5-2 minutes. The timer at the bottom starts automatically when you tick a set.</p>'+
  '<p><b>Between sessions.</b> Wednesday and the weekend are off. Each muscle gets about 72 hours between its two weekly sessions, which is what it needs.</p></div>'+

  '<div class="card"><h3>Short on time</h3>'+

  '<p><b>30 minutes.</b> Drop exercise 3, do the rest as two supersets of three sets, every set at 0-1 RIR. Monday drops incline press, Tuesday drops the row, Thursday drops dips, Friday drops the cable row. The lateral raises and vertical pulls never get dropped.</p>'+
  '<p><b>20 minutes.</b> Two supersets, two sets each, all to failure. Still worth doing.</p></div>'+

  '<div class="card"><h3>No gym today</h3>'+

  '<p>No rep targets at home. Every set goes to 0-1 RIR with a three second lowering, because light loads still grow muscle when taken close to failure.</p></div>'+

  '<div class="card"><h3>The three that matter most</h3>'+
  '<p><b>1. Lateral raises.</b> The lateral delt is the cap that sets your widest point, and pressing alone does not build it.</p>'+
  '<p><b>2. Vertical pulls.</b> Pull-ups and pulldowns build the lats, which are the flare and the lower half of the V.</p>'+
  '<p><b>3. Overhead triceps extensions.</b> Triceps are about two thirds of your arm, and the overhead stretch grew them around 40 percent more than pushdowns in MRI-measured research.</p></div>'+

  '<div class="card"><h3>Quiet weak links</h3>'+
  '<p><b>Rear delts</b> keep the shoulder looking round from the side, trained by face pulls and every row. <b>Lower and mid traps</b> stop the shoulders rolling forward, which is what makes a wide frame read as wide.</p>'+

/* ---------- rest timer ---------- */
var timer=document.getElementById("timer"), tnum=document.getElementById("tnum"),
    tinfo=document.getElementById("tinfo"), tbar=document.getElementById("tbar");

function fmt(s){var m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;
  return (s<0?"+":"")+m+":"+(x<10?"0":"")+x}

/* The timer counts against an end time, not by ticking down, so it stays right when the phone
   locks or the app is closed and reopened (iOS pauses timers in the background). It's saved as
   "rest" = {end, total, rang}. */
var rest=null, wakeLock=null, actx=null;
function unlockSound(){ // must run inside a tap, or iOS keeps the audio muted
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){}
}
function beep(){ // two short tones; plays alongside music and respects the silent switch
  try{ if(!actx) return; var t=actx.currentTime;
    [0,0.22].forEach(function(o){ var g=actx.createGain(), osc=actx.createOscillator(); osc.type="sine"; osc.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.35,t+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.18);
      osc.connect(g); g.connect(actx.destination); osc.start(t+o); osc.stop(t+o+0.2); });
  }catch(e){}
}
function keepAwake(on){ // screen stays on while resting, so you see (and hear) the end of the rest
  try{
    if(on && !wakeLock && navigator.wakeLock && document.visibilityState==="visible")
      navigator.wakeLock.request("screen").then(function(l){ wakeLock=l; l.addEventListener("release",function(){ wakeLock=null }); }).catch(function(){});
    if(!on && wakeLock){ wakeLock.release().catch(function(){}); wakeLock=null; }
  }catch(e){}
}
function startTimer(sec){
  stopTimer(); rest={end:Date.now()+sec*1000, total:sec, rang:false}; store.set("rest",rest);
  timer.classList.add("up"); keepAwake(true); tick();
  timerId=setInterval(tick,250);
}
function tick(){
  if(!rest) return;
  tLeft=Math.ceil((rest.end-Date.now())/1000); tTotal=rest.total;
  if(tLeft<-120) return stopTimer();
  var over=tLeft<=0;
  timer.classList.toggle("over",over);
  tinfo.textContent=over?"Rest complete, go again":"Rest before the next set";
  if(over && !rest.rang){
    rest.rang=true; store.set("rest",rest);
    if(tLeft>-3){ beep(); if(navigator.vibrate) navigator.vibrate([180,90,180]); } // not when reopening long after
    keepAwake(false);
  }
  paint();
}
function paint(){
  tnum.textContent=fmt(tLeft);
  var p=tLeft>0?(tLeft/tTotal*100):0; tbar.style.width=Math.max(0,p)+"%";
}
function stopTimer(){if(timerId)clearInterval(timerId);timerId=null;rest=null;store.set("rest",null);keepAwake(false);timer.classList.remove("up","over")}
document.getElementById("tskip").onclick=stopTimer;
document.getElementById("tadd").onclick=function(){ if(!rest) return; unlockSound();
  rest.end+=30000; rest.total+=30; if(rest.end>Date.now()){ rest.rang=false; keepAwake(true); } store.set("rest",rest); tick()};

/* session clock in the header: starts at the first ticked warm-up or set, cleared by Finish */
var clock=document.getElementById("clock");
function paintClock(){
  var s=page==="day" && logFor(day)._start;
  clock.hidden=!s; if(s) clock.textContent=fmt(Math.floor((Date.now()-s)/1000));
}
setInterval(paintClock,1000);

document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"){ tick(); paintClock(); if(rest && Date.now()<rest.end) keepAwake(true); } });

back.onclick=function(){stopTimer();page="home";window.scrollTo(0,0);render()};
render();
// a rest that was running when the app was closed carries on
(function(){ var r=store.get("rest"); if(r && r.end && Date.now()-r.end < 120000){ rest=r; timer.classList.add("up"); if(Date.now()<r.end) keepAwake(true); tick(); timerId=setInterval(tick,250); } else store.set("rest",null); })();
</script>
