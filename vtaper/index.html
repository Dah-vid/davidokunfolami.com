<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="V-Taper">
<title>V-Taper</title>
<style>
/* Restyled to match davidokunfolami.com: carbon / graphite / smoke / paper, Archivo Expanded
   Black for display type, square corners, hairline rows instead of cards, outlined numerals.
   The font is a copy of the site's, kept in this folder so the app stays self-contained offline. */
@font-face{font-family:"Archivo";src:url("archivo-expanded-black.woff2") format("woff2");font-weight:900;font-stretch:125%;font-style:normal;font-display:swap}
:root{
  --carbon:#101214; --panel:#17191c; --graphite:#26292c; --smoke:#878d93; --paper:#eae7e1; --dark-smoke:#4a4e52;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --pad:18px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;background:var(--carbon);color:var(--paper);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
body{padding-bottom:150px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit;border-radius:0}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);font-weight:600}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(16,18,20,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--graphite);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px}
.bar{display:flex;align-items:center;gap:12px;min-height:40px}
.back{background:none;border:0;color:var(--smoke);font-size:15px;padding:10px 4px 10px 0;cursor:pointer}
h1{margin:0;font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;
  font-size:18px;line-height:1;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:14px;color:var(--smoke);white-space:nowrap}
.wk{background:var(--carbon);border:1px solid var(--graphite);padding:8px 8px;font-size:13px;color:var(--paper);-webkit-appearance:none;appearance:none}

/* ---------- taper progress: five square bars, done = paper, current = outlined ---------- */
.taper{display:flex;gap:3px;margin-top:12px;align-items:flex-end;height:16px}
.taper i{flex:1;background:var(--graphite)}
.taper i:nth-child(1){height:16px}.taper i:nth-child(2){height:14px}
.taper i:nth-child(3){height:12px}.taper i:nth-child(4){height:10px}
.taper i:nth-child(5){height:8px}
.taper i.on{background:var(--paper)}
.taper i.now{background:transparent;box-shadow:inset 0 0 0 1px var(--paper)}

main{padding:var(--pad)}

/* ---------- home: the days as big hairline rows, like the site's project list ---------- */
.lede{color:var(--smoke);font-size:14px;margin:4px 0 18px}
.day{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;
  width:100%;text-align:left;background:none;color:var(--paper);border:0;border-top:1px solid var(--graphite);
  padding:18px 4px;cursor:pointer}
.day:last-of-type{border-bottom:1px solid var(--graphite)}
.day b{font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:.01em;
  font-size:clamp(1.5rem,8vw,2.25rem);line-height:1}
.day span{grid-column:1/-1;color:var(--smoke);font-size:14px}
.day em{font-style:normal;color:var(--smoke);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.day.rest{cursor:default}
.day.rest b{color:transparent;-webkit-text-stroke:1px var(--smoke);font-size:clamp(1rem,5vw,1.35rem)}
.day:not(.rest):active{background:var(--paper);color:var(--carbon)}
.day:not(.rest):active span,.day:not(.rest):active em{color:var(--dark-smoke)}
@media (hover:hover){
  .day:not(.rest):hover{background:var(--paper);color:var(--carbon)}
  .day:not(.rest):hover span,.day:not(.rest):hover em{color:var(--dark-smoke)}
}
.sec{margin:30px 0 6px}
.tiles{display:flex;flex-direction:column;border-bottom:1px solid var(--graphite)}
.tile{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 12px;
  background:none;color:var(--paper);border:0;border-top:1px solid var(--graphite);
  padding:14px 4px;text-align:left;cursor:pointer;font-size:15px;font-weight:700}
.tile::after{content:"\2192";color:var(--smoke);font-weight:400;grid-row:1;grid-column:2}
.tile s{grid-column:1;text-decoration:none;color:var(--smoke);font-size:13px;font-weight:400}
.tile:active{background:var(--paper);color:var(--carbon)}
.tile:active s,.tile:active::after{color:var(--dark-smoke)}

/* ---------- warm-up ---------- */
.warm{border-top:1px solid var(--graphite);margin-bottom:26px}
.warm h3{margin:14px 0 4px}
.wrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--graphite);cursor:pointer}
.tick{width:24px;height:24px;flex:0 0 24px;border:1px solid var(--smoke);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.wrow.done .tick{background:var(--paper);border-color:var(--paper);color:var(--carbon)}
.wrow.done p{color:var(--smoke);text-decoration:line-through}
.wrow p{margin:0;font-size:15px;flex:1}
.wrow p s{display:block;text-decoration:none;color:var(--smoke);font-size:13px}

/* ---------- exercise ---------- */
.ex{border-top:1px solid var(--graphite);margin-bottom:6px;padding-left:0;transition:padding .2s}
.ex.active{border-left:3px solid var(--paper);padding-left:12px}
.ex.complete{opacity:.5}
.exh{display:flex;gap:14px;padding:16px 0 6px;cursor:pointer;align-items:flex-start}
.n{flex:0 0 auto;min-width:34px;font-family:var(--display);font-weight:900;font-stretch:125%;font-size:28px;line-height:.95;
  color:transparent;-webkit-text-stroke:1px var(--smoke)}
.ex.active .n{color:var(--paper);-webkit-text-stroke:0}
.ex.complete .n{-webkit-text-stroke:1px var(--smoke)}
.exh div{flex:1;min-width:0}
.exh b{display:block;font-size:17px;font-weight:700;letter-spacing:-.005em}
.meta{color:var(--smoke);font-size:13px;margin-top:2px}
.chev{border:1px solid var(--graphite);color:var(--smoke);font-size:12px;padding:5px 9px;white-space:nowrap;margin-top:1px}
.ex.open .chev{background:var(--paper);border-color:var(--paper);color:var(--carbon)}

.sets{padding:0 0 16px}
.srow{display:flex;align-items:center;gap:8px;margin-top:8px}
.slab{width:22px;flex:0 0 22px;color:var(--smoke);font-size:13px;text-align:center}
.fld{flex:1;min-width:0;position:relative}
.fld input{width:100%;background:var(--panel);border:1px solid var(--graphite);
  padding:12px 40px 12px 12px;font-size:17px;font-weight:600;outline:none;text-align:left;-webkit-appearance:none;appearance:none}
.fld input::placeholder{color:var(--dark-smoke)}
.fld input:focus{border-color:var(--paper)}
.fld u{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  text-decoration:none;color:var(--smoke);font-size:12px;pointer-events:none}
.ok{width:52px;flex:0 0 52px;height:48px;border:1px solid var(--smoke);background:none;
  color:var(--smoke);font-size:18px;cursor:pointer}
.srow.done .ok{background:var(--paper);border-color:var(--paper);color:var(--carbon)}
.srow.done input{color:var(--smoke)}
.hint{color:var(--smoke);font-size:13px;margin:10px 0 0 30px}
.hint b{color:var(--paper);font-weight:600}

.detail{border:1px solid var(--graphite);padding:14px;background:var(--panel);display:none;margin:8px 0 6px}
.ex.open .detail{display:block}
.detail h4{margin:0 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);font-weight:600}
.detail p{margin:0 0 14px;font-size:15px;color:var(--paper)}
.detail p:last-child{margin-bottom:0}
.detail .sub{color:var(--smoke);font-size:14px}

/* ---------- rest timer: big digits; the whole panel inverts when rest is over ---------- */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(23,25,28,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--graphite);padding:14px var(--pad) calc(env(safe-area-inset-bottom) + 14px);
  transform:translateY(110%);transition:transform .28s ease}
.timer.up{transform:translateY(0)}
.trow{display:flex;align-items:center;gap:12px}
.tnum{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:40px;line-height:1;letter-spacing:0;min-width:120px;font-variant-numeric:tabular-nums}
.tinfo{flex:1;min-width:0;font-size:13px;color:var(--smoke)}
.tbtn{background:none;border:1px solid var(--smoke);padding:12px 12px;font-size:14px;font-weight:700;cursor:pointer;min-height:46px}
.tbar{height:3px;background:var(--graphite);margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--paper);width:100%;transition:width .25s linear}
.timer.over{background:var(--paper);color:var(--carbon);border-top-color:var(--paper)}
.timer.over .tinfo{color:var(--dark-smoke)}
.timer.over .tbtn{border-color:var(--carbon)}
.timer.over .tbar{background:#c9c6c0}

/* ---------- reference + session end ---------- */
.card{border-top:1px solid var(--graphite);padding:16px 0 6px}
.card h3{margin:0 0 8px;font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:16px;line-height:1.15;letter-spacing:.01em}
.card p{margin:0 0 10px;font-size:15px;color:var(--smoke)}
.card p b{color:var(--paper);font-weight:600}
.finish{width:100%;background:var(--paper);color:var(--carbon);border:0;padding:17px;margin-top:22px;cursor:pointer;
  font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:16px;letter-spacing:.02em}
.finish:active{filter:brightness(.85)}
.ghost{width:100%;background:none;color:var(--smoke);border:1px solid var(--graphite);padding:13px;font-size:14px;margin-top:10px;cursor:pointer}

/* ---------- library: everything from the spreadsheet, as hairline rows ---------- */
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 18px}
.lchips button{background:none;border:1px solid var(--graphite);padding:7px 10px;font-size:13px;color:var(--smoke);cursor:pointer}
.lchips button:active{background:var(--paper);border-color:var(--paper);color:var(--carbon)}
.lsec{margin:26px 0 0;padding-bottom:8px;font-family:var(--display);font-weight:900;font-stretch:125%;text-transform:uppercase;
  font-size:15px;line-height:1.15;letter-spacing:.01em;scroll-margin-top:90px}
.lsec:first-child,.lchips+.lsec{margin-top:4px}
.lnote{color:var(--smoke);font-size:14px;margin:0 0 12px}
.lcard{border-top:1px solid var(--graphite);padding:12px 0}
.lcard h3{margin:0 0 6px;font-size:15px;font-weight:700}
.lcard p{margin:0 0 8px;font-size:15px}
.lcard p:last-child{margin-bottom:0}
.lcard p i{display:block;font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--smoke);font-weight:600;margin-bottom:2px}
.lcard b{font-weight:700}
.detail .full{border-top:1px solid var(--graphite);margin-top:14px;padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="back" id="back" hidden>Back</button>
    <h1 id="title">V-Taper</h1>
    <span class="clock num" id="clock" title="Session time" hidden></span>
    <select class="wk" id="week" title="Training week"></select>
  </div>
  <div class="taper" id="taper" hidden><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main id="view"></main>

<div class="timer" id="timer">
  <div class="trow">
    <div class="tnum num" id="tnum" role="timer" aria-live="off">2:00</div>
    <div class="tinfo" id="tinfo" aria-live="polite">Rest</div>
    <button class="tbtn" id="tadd">+30s</button>
    <button class="tbtn" id="tskip">Skip</button>
  </div>
  <div class="tbar"><i id="tbar"></i></div>
</div>

<script>
/* ---------- storage: localStorage when available, memory otherwise ---------- */
var mem={};
var store={
  get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}
    catch(e){return mem[k]!==undefined?mem[k]:null}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};

/* ---------- programme data ---------- */
var WARM=[
 {t:"Pulse raiser",s:"3-4 min easy incline walk, rower or bike"},
 {t:"Arm circles",s:"10 forward, 10 backward"},
 {t:"Band pull-aparts",s:"2 x 15, squeeze the shoulder blades"},
 {t:"Bodyweight squats",s:"10, slow and deep"},
 {t:"Dead hang",s:"20-30 sec from any bar"}
];

var DAYS={
 mon:{name:"Push A",sub:"Press, width, triceps",ramp:"Overhead press ramp: empty bar x 10, then 50% x 6, then 75% x 3",
  ex:[
   {n:"Overhead Press",sr:"3 x 5-8",sets:3,rest:150,cue:"Brace hard, squeeze glutes, press around the head not in front of it. Finish with the bar over the back of your head.",feel:"At lockout the bar feels weightless over mid-foot. Delts fatigue first, then triceps. No lower-back arch.",sub:"Seated DB press, machine shoulder press, landmine press"},
   {n:"Cable Lateral Raise",sr:"3 x 12-18",sets:3,rest:105,cue:"Lowest pulley, lightest plates. For the right arm, stand with your left side to the machine, handle in the right hand, cable across your thighs. Start with the hand in front of the far thigh, raise out to the side and slightly forward, elbow first, to shoulder height. Lower 2-3 seconds.",feel:"Burn on the side cap of the shoulder, traps quiet. Self-check: if your hand is above your elbow at the top, you led with the hand.",sub:"DB lateral raise, machine lateral raise, lean-away DB raise"},
   {n:"Incline DB Press",sr:"3 x 8-12",sets:3,rest:150,cue:"Bench at 30 degrees, not 45. Pin the shoulder blades back and down into the bench and keep them there all set. Elbows 45 degrees from the torso, lower to the upper-chest line, stop just short of lockout, and think squeeze the DBs together on the way up.",feel:"Stretch across the upper chest at the bottom, chest fatigues before the front delts. Not feeling it? Drop the weight 20 percent, 3 seconds down, and do one light set of flys first to wake it up.",sub:"Low-incline barbell or Smith press, incline machine press"},
   {n:"Overhead Triceps Extension",sr:"3 x 10-15",sets:3,rest:105,cue:"Rope on the low pulley, back to the stack, split stance. Hinge the torso forward 30-45 degrees with a flat back. Upper arms up beside the ears pointing forward, hands behind the head. Only the forearm hinges.",feel:"A real pull down the back of the upper arm each rep. Nothing felt in the shoulders or lats.",sub:"Two-hand DB overhead extension, EZ skullcrusher lowered behind the head. A pushdown is NOT a substitute here."},
   {n:"Smith Squat (feet forward)",sr:"3 x 8-12",sets:3,rest:150,cue:"Bar on the upper traps, safety stops set. Feet 20-30 cm in front of the bar, shoulder-width, toes slightly out. Lower 2-3 seconds to at least parallel, knees over toes, heels down. Stop just short of locked knees.",feel:"Stretch down the front of the thighs, quads burning by the last reps. Your back leans into the bar; hands only steady it. Heels lifting means feet go further forward.",sub:"Leg press, front squat, goblet squat with heels raised"}
  ]},
 tue:{name:"Pull A",sub:"Width, thickness, biceps",ramp:"Pull-up ramp: light pulldown x 10-12, then 3-4 crisp bodyweight pull-ups, then add weight",
  ex:[
   {n:"Weighted Pull-up",sr:"3 x 6-10",sets:3,rest:150,cue:"Start from a dead hang, blades set down first. Drive the elbows down into your back pockets.",feel:"Sides of the back switch on before rep 1 and stay on. Outer back pumped after, not the arms.",sub:"Lat pulldown (any wide handle), assisted pull-up machine, single-arm kneeling cable pulldown"},
   {n:"DB Chest-Supported Row",sr:"3 x 8-12",sets:3,rest:150,cue:"Incline bench at 30-45 degrees, face down, chest at the top of the pad, feet planted behind. DBs hang, palms facing. Pull elbows to your back pockets, squeeze 1 second, lower 2 seconds.",feel:"If your chest lifts off the pad you cheated. Blades spread at the bottom, mid-back tires before the biceps. DBs hitting the frame means raise the incline.",sub:"Single-arm DB row with hand and knee on a flat bench, seated cable row, T-bar row"},
   {n:"Cable Lat Pullover",sr:"3 x 12-15",sets:3,rest:105,cue:"Arms nearly straight and fixed, hinge forward 30-45 degrees, pull in an arc to your thighs.",feel:"Stretch from armpit down the ribs at the top. If you feel that, it is working. Zero biceps.",sub:"DB pullover across a bench, machine pullover, straight-arm pulldown"},
   {n:"Incline DB Curl",sr:"3 x 8-12",sets:3,rest:105,cue:"Bench at 45-55 degrees. Let the arms hang behind the torso. Elbows point at the floor and stay there.",feel:"Distinct stretch down the front of the upper arm at the dead hang. Burn sits high, near the shoulder.",sub:"Bayesian cable curl, seated curl on a reclined bench. A preacher curl is NOT a substitute here."},
   {n:"Romanian Deadlift",sr:"3 x 8-10",sets:3,rest:150,cue:"Form breaking with weight? Do the broomstick and wall hinge drills for two weeks with 8-10 kg DBs to knee height, seated leg curls as the leg slot meanwhile. Then: hips back, knees soft and frozen, bar dragging on the thighs, flat back.",feel:"Lower only until you feel a strong hamstring stretch, then reverse. Next-day soreness is hamstrings, not lower back.",sub:"DB RDL, seated leg curl, 45-degree back extension"}
  ]},
 thu:{name:"Push B",sub:"Width emphasis, triceps",ramp:"Seated DB press ramp: very light DBs x 12, then 60-70% x 5",
  ex:[
   {n:"Seated DB Shoulder Press",sr:"3 x 8-12",sets:3,rest:150,cue:"Seat at 75-85 degrees, one notch back from upright. Forearms vertical under the DBs. Press up and slightly together to a full lockout.",feel:"The DB feels balanced on a stacked forearm. If your lower back peels off the pad, it is too heavy.",sub:"Machine shoulder press, standing overhead press, landmine press"},
   {n:"DB Lateral Raise",sr:"3 x 12-18",sets:3,rest:105,cue:"Slight forward lean, soft elbows. A string on the elbow pulls it up and out, the hand follows underneath. Elbow stays the highest point. Two second lowering.",feel:"Push the blades down before the set so the traps cannot shrug. Burn on the outside of the shoulder.",sub:"Cable lateral raise, machine lateral raise, lean-away DB raise"},
   {n:"Dips (assisted first)",sr:"3 x 8-12",sets:3,rest:150,cue:"HARD RULE: upper arms parallel to the floor and no lower, shoulder never below the elbow. Elbows track back, shoulders stay down away from the ears, lean 20-30 degrees, 2-3 seconds down. Weeks 1-4 on the assisted machine only.",feel:"Stretch across the lower chest at the bottom, never a pull or pinch. Any pinch in the pec or front shoulder: stop the set and swap to close-grip bench.",sub:"Assisted dip machine, close-grip bench press, flat or decline DB press"},
   {n:"Cable Rope Pushdown",sr:"3 x 12-15",sets:3,rest:105,cue:"Rope on the top pulley. Elbows pinned to your sides like a note is trapped there. Spread the rope at the bottom, squeeze.",feel:"Only the forearms move. The horseshoe on the outer upper arm contracts hard at lockout.",sub:"Straight-bar pushdown, single-arm cable pushdown, triceps extension machine"},
   {n:"Leg Press",sr:"3 x 12-20",sets:3,rest:150,cue:"Lower back glued to the pad, feet low and shoulder-width. Press through the whole foot, never slam the lockout.",feel:"The moment your tailbone starts to lift is your depth. Quad burn above the knees.",sub:"Hack squat, Smith squat with feet forward, goblet squat or belt squat"}
  ]},
 fri:{name:"Pull B",sub:"Width, back detail, arms",ramp:"Pulldown ramp: 40% of working weight x 12, then 70% x 5",
  ex:[
   {n:"Neutral-Grip Lat Pulldown",sr:"3 x 10-14",sets:3,rest:150,cue:"Set the blades down, drive elbows to your hips, let the arms stretch fully overhead each rep.",feel:"Every rep ends with the taut feeling down the sides of the back. Lean stays fixed.",sub:"Neutral-grip pull-up, wide pulldown, single-arm cable pulldown"},
   {n:"Seated Cable Row (wide)",sr:"3 x 10-14",sets:3,rest:150,cue:"Sit so the stack is already lifted a few cm at full arm stretch. Sit tall, pull wide to the upper abdomen, elbows 45-60 degrees, hard blade squeeze.",feel:"Torso angle identical at the start and end of every rep. If you are further back by rep 5, you are leaning.",sub:"Machine row (wide), chest-supported DB row, T-bar row"},
   {n:"Face Pull",sr:"3 x 15-20",sets:3,rest:105,cue:"Rope at eye height, pull to your eyes with high wide elbows, split the rope, one second pause.",feel:"Knuckles beside your ears at the peak. If it lands at your chin, the biceps take over.",sub:"Reverse pec deck, rear-delt DB fly on an incline bench, band pull-aparts"},
   {n:"Hammer Curl",sr:"3 x 10-14",sets:3,rest:105,cue:"Neutral grip throughout, elbows touching your sides, no swing. Two second lowering.",feel:"Pump sits lower and more to the outside than a normal curl. Elbow contact on the ribs is your sensor.",sub:"Rope cable hammer curl, cross-body hammer curl, reverse-grip EZ curl"},
   {n:"Bulgarian Split Squat",sr:"2 x 10-12 each leg",sets:2,rest:105,cue:"Long stride, rear foot laces-down on a bench, slight forward lean. Drive through the front heel.",feel:"Long stride gives a glute stretch and a heavy front heel. Short stride burns only the quad and lifts the heel.",sub:"Walking lunge, reverse lunge, step-up, single-leg press"}
  ]}
};

var WEEKS=[
 {v:"1",l:"Week 1-2",rir:"2-3 RIR everywhere. Set your baselines."},
 {v:"3",l:"Week 3-5",rir:"1-2 RIR. Double progression running."},
 {v:"6",l:"Week 6-8",rir:"Isolations 0-1 RIR, compounds 1-2 RIR."},
 {v:"9",l:"Deload",rir:"Cut sets by half, moderate loads, stay well shy of failure."}
];

orted Row (incline bench): feeler set, then 3 x 8-12, rest 2-3 min"]}, {"t": "row", "v": ["0:32-0:42", "3. Cable Lat Pullover: feeler set, then 3 x 12-15, rest 1.5-2 min"]}, {"t": "row", "v": ["0:42-0:52", "4. Incline DB Curl: feeler set, then 3 x 8-12, rest 1.5-2 min"]}, {"t": "row", "v": ["0:52-1:05", "5. Romanian Deadlift: TWO feeler sets, then 3 x 8-10, rest 2-3 min. Done."]}, {"t": "sec", "x": "THURSDAY - PUSH B, MINUTE BY MINUTE"}, {"t": "row", "v": ["0:00-0:05", "General warm-up: 3-4 min pulse raiser + arm circles + band pull-aparts + 10 bodyweight squats + dead hang"]}, {"t": "row", "v": ["0:05-0:09", "Seated DB press ramp: very light DBs x 12 -> ~60-70% x 5"]}, {"t": "row", "v": ["0:09-0:21", "1. Seated DB Shoulder Press: 3 x 8-12, rest 2-3 min"]}, {"t": "row", "v": ["0:21-0:31", "2. DB Lateral Raise: feeler set, then 3 x 12-18, rest 1.5-2 min"]}, {"t": "row", "v": ["0:31-0:41", "3. Dips (chest-leaning): one easy bodyweight set of 5, then 3 x 8-12, rest 2-3 min"]}, {"t": "row", "v": ["0:41-0:51", "4. Cable Rope Pushdown: feeler set, then 3 x 12-15, rest 1.5-2 min"]}, {"t": "row", "v": ["0:51-1:04", "5. Leg Press: TWO feeler sets, then 3 x 12-20, rest 2-3 min. Done."]}, {"t": "sec", "x": "FRIDAY - PULL B, MINUTE BY MINUTE"}, {"t": "row", "v": ["0:00-0:05", "General warm-up: 3-4 min pulse raiser + arm circles + band pull-aparts + 10 bodyweight squats + dead hang"]}, {"t": "row", "v": ["0:05-0:09", "Pulldown ramp: ~40% of working weight x 12 -> ~70% x 5"]}, {"t": "row", "v": ["0:09-0:21", "1. Neutral-Grip Lat Pulldown: 3 x 10-14, rest 2-3 min"]}, {"t": "row", "v": ["0:21-0:31", "2. Seated Cable Row (wide): feeler set, then 3 x 10-14, rest 2-3 min"]}, {"t": "row", "v": ["0:31-0:40", "3. Face Pull: feeler set, then 3 x 15-20, rest 1.5-2 min"]}, {"t": "row", "v": ["0:40-0:49", "4. Hammer Curl: feeler set, then 3 x 10-14, rest 1.5-2 min"]}, {"t": "row", "v": ["0:49-1:00", "5. Bulgarian Split Squat: one easy bodyweight set per leg, then 2 x 10-12 per leg, rest 1.5-2 min. Done."]}, {"t": "sec", "x": "THE THREE NUMBERS THAT RUN EVERYTHING"}, {"t": "row", "v": ["Rest between SETS", "Compounds (presses, pull-ups, rows, squats, RDL): 2-3 min. Isolations (raises, curls, extensions, face pulls): 1.5-2 min. Also printed on the Programme tab under each exercise."]}, {"t": "row", "v": ["Rest between WORKOUTS", "Wednesday + the weekend are off. Each muscle gets ~72h between its two weekly hits - exactly what it needs."]}, {"t": "row", "v": ["RIR (reps in reserve)", "How many reps you COULD still have done when you stopped. 2 RIR = stopped 2 short of failure, 0 RIR = failure. Pick weights that land you in the rep range at the target RIR (see 8-Week Plan tab for targets by week)."]}, {"t": "sec", "x": "TAB MAP - WHERE EVERYTHING LIVES"}, {"t": "row", "v": ["Programme", "The 4 training days in table form. Open this at the gym."]}, {"t": "row", "v": ["Warm-Ups", "The warm-up explained in full detail with ramp numbers."]}, {"t": "row", "v": ["Form Guide", "How to do every exercise + verify by feel without a mirror. Machine settings and form fixes are on the Setup Answers tab."]}, {"t": "row", "v": ["Session Guide", "Order logic, the one legal swap, superset shortcut."]}, {"t": "row", "v": ["Time-Capped Sessions", "60-min and ~30-min versions for tired or busy days."]}, {"t": "row", "v": ["Subs by Day / Subs Ranked", "Substitutes when equipment is taken: by day (with where barbell lifts fit), and ranked with what each sub must keep."]}, {"t": "row", "v": ["No-Gym Bodyweight", "Home sessions that replace a missed day."]}, {"t": "row", "v": ["8-Week Plan", "How effort progresses across the block, plus the deload."]}, {"t": "row", "v": ["Tracking Log", "Fill in load, reps, RIR every session. The log IS the progress."]}, {"t": "row", "v": ["2-3-5 Day Variants", "Alternative weekly schedules."]}, {"t": "row", "v": ["Guide", "The science, top-3 ranking, weak links, leg logic, sources."]}]}, {"n": "Programme", "b": [{"t": "note", "x": "How to use: work inside the rep range. Hit the top of the range on all sets at target RIR → add smallest increment next session, drop to bottom of range. RIR = reps in reserve (see Guide sheet). Do exercises in the numbered order - see the Warm-Ups tab before every session, and the Session Guide tab for order logic and rest times."}, {"t": "sec", "x": "MONDAY - PUSH A (press + width + triceps)"}, {"t": "row", "v": ["1", "Overhead Press (BB or DB)", "3 × 5–8\nrest 2-3 min", "Front delt, triceps / upper chest, lateral delt", "Brace hard, squeeze glutes, press around the head not in front of it", "Structural pressing strength + heavy triceps loading"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["2", "Cable Lateral Raise", "3 × 12–18\nrest 1.5-2 min", "LATERAL DELT / front delt", "Lead with the elbow, no swinging; cable keeps tension at the stretched bottom", "#1 width-builder - caps the shoulder, tops the V"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["3", "Incline DB Press", "3 × 8–12\nrest 2-3 min", "Upper chest, front delt / triceps", "Slight arch, full stretch at the bottom of every rep", "Upper-chest fullness widens the frame up high"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["4", "Overhead Cable Triceps Extension", "3 × 10–15\nrest 1.5-2 min", "TRICEPS (long head)", "Elbows high and fixed; chase the deep stretch behind the head", "~40% more triceps growth than pushdowns (Maeo 2022)"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["5", "Smith Squat (feet forward)", "3 × 8–12\nrest 2-3 min", "Quads / glutes", "Feet 20-30 cm in front of the bar, shoulder-width. Lower 2-3 s to at least parallel, heels down, hands only steady the bar", "Upright torso puts the load on the quads, like a hack squat"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "sec", "x": "TUESDAY - PULL A (width + thickness + biceps)"}, {"t": "row", "v": ["1", "Weighted Pull-up (or wide Lat Pulldown)", "3 × 6–10\nrest 2-3 min", "LATS / biceps, mid-back", "Elbows down and in, full hang at the bottom, chest to bar", "The flare - lat width forms the lower half of the V"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["2", "DB Chest-Supported Row (incline bench)", "3 × 8–12\nrest 2-3 min", "Mid-back, lats / rear delt, biceps", "Chest on the top of a 30-45 degree bench, elbows to back pockets, 1 s squeeze, chest never leaves the pad", "Back thickness with zero lower-back fatigue"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["3", "Cable Lat Pullover", "3 × 12–15\nrest 1.5-2 min", "LATS (stretched) / long-head triceps", "Reach long overhead, feel the stretch under the armpit", "Isolates lats at long muscle length - the sweep"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["4", "Incline DB Curl", "3 × 8–12\nrest 1.5-2 min", "BICEPS (long head) / brachialis", "Let the arm hang fully behind the torso - the stretch is the point", "Lengthened curl → more proximal biceps growth & peak (Kassiano 2025)"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["5", "Romanian Deadlift", "3 × 8–10\nrest 2-3 min", "Hamstrings, glutes / erectors", "Hinge at the hip, soft knees, stop at mid-shin, feel the hamstring stretch", "Whole posterior chain at long muscle length in one slot"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "sec", "x": "THURSDAY - PUSH B (width emphasis + triceps)"}, {"t": "row", "v": ["1", "Seated DB Shoulder Press", "3 × 8–12\nrest 2-3 min", "Front + lateral delt / triceps", "Slightly wider elbow path than barbell to share load into side delt", "Delt mass with more lateral bias"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["2", "DB Lateral Raise", "3 × 12–18\nrest 1.5-2 min", "LATERAL DELT / front delt", "Slight forward lean, lead with elbows, control the lowering", "Second weekly exposure on the #1 priority muscle"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["3", "Dips (chest-leaning)", "3 × 8–12\nrest 2-3 min", "Chest, triceps / front delt", "Lean forward for chest, lock out hard for triceps", "Compound that doubles as heavy triceps loading"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["4", "Cable Rope Pushdown", "3 × 12–15\nrest 1.5-2 min", "TRICEPS (lateral/medial head)", "Elbows pinned to sides, spread the rope at the bottom", "Covers the two heads the overhead extension misses"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["5", "Leg Press", "3 × 12–20\nrest 2-3 min", "Quads / glutes", "Feet low & narrow for quads; don't let the lower back round", "Quad volume, safe to failure, near-zero systemic cost"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "sec", "x": "FRIDAY - PULL B (width + back detail + arms)"}, {"t": "row", "v": ["1", "Neutral-Grip Lat Pulldown", "3 × 10–14\nrest 2-3 min", "LATS / biceps", "Long stretch overhead, elbows to hips - different grip from Tuesday", "Third weekly vertical pull - width from a second angle"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["2", "Seated Cable Row (wide)", "3 × 10–14\nrest 2-3 min", "Mid-back, rear delt / biceps", "Pull wide to the upper abdomen, retract the blades", "Upper-back thickness; posture that displays the width"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["3", "Face Pull / Reverse Pec Deck", "3 × 15–20\nrest 1.5-2 min", "REAR DELT / lower + mid traps", "Pull to the eyes, externally rotate, pause at peak", "Fixes the silent weak link - 3D delts + scapular control"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["4", "Hammer Curl (or Bayesian cable curl)", "3 × 10–14\nrest 1.5-2 min", "BRACHIALIS, brachioradialis / biceps", "Neutral grip, no swing, squeeze at the top", "Pushes the biceps up → arm width from the side; forearms"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}, {"t": "row", "v": ["5", "Bulgarian Split Squat", "2 × 10–12 /leg\nrest 1.5-2 min", "Quads, glutes / hamstrings", "Long stride for glute/stretch bias; torso slightly forward", "Unilateral ROM + stretch; negligible spinal fatigue"], "h": ["#", "Exercise", "Sets × Reps · rest", "Primary / Secondary", "Coaching cue", "Physique payoff"]}]}, {"n": "Warm-Ups", "b": [{"t": "note", "x": "Two parts, every session: PART 1 is the same every day (5 min). PART 2 ramps you into that day's FIRST exercise only - everything after exercise 1 needs just one light feeler set (~50% of working weight x 8) because you're already warm. Warm-up sets are NOT logged and are NEVER taken anywhere near failure - they prepare, they don't fatigue."}, {"t": "sec", "x": "PART 1 - GENERAL (every session, ~5 min, in this order)"}, {"t": "row", "v": ["1. Raise the pulse", "3-4 min", "Incline treadmill walk, rower, or bike at easy pace. You want warm and slightly out of breath, not tired."]}, {"t": "row", "v": ["2. Arm circles", "10 each way", "Big slow circles forward then backward, both arms."]}, {"t": "row", "v": ["3. Band pull-aparts", "2 x 15", "Light band at chest height, pull to full stretch, squeeze the blades. Wakes up rear delts and scapular muscles before any pressing or pulling. No band? Do prone Y-raises or wall slides."]}, {"t": "row", "v": ["4. Bodyweight squats", "1 x 10", "Slow and deep. Preps hips and knees for the leg slot later."]}, {"t": "row", "v": ["5. Dead hang", "20-30 sec", "Hang from any bar, let the shoulders stretch and decompress. Doubles as grip prep on pull days."]}, {"t": "sec", "x": "PART 2 - RAMP INTO EXERCISE 1 (day by day)"}, {"t": "row", "v": ["MONDAY - Overhead Press", "3 ramp sets", "Empty bar x 10 -> ~50% of working weight x 6 -> ~75% x 3 -> rest 90s -> first working set. Example if working weight is 40kg: bar x 10, 20kg x 6, 30kg x 3."]}, {"t": "row", "v": ["TUESDAY - Weighted Pull-up", "2-3 ramp sets", "Light lat pulldown x 10-12 (about half your bodyweight on the stack) -> bodyweight pull-ups x 3-4 (crisp, nowhere near failure) -> add your working weight. If you run pulldowns instead: 40% x 12 -> 70% x 5 -> working sets."]}, {"t": "row", "v": ["THURSDAY - Seated DB Press", "2 ramp sets", "Very light DBs x 12 (e.g. 8kg if working with 20s) -> ~60-70% x 5 -> working sets."]}, {"t": "row", "v": ["FRIDAY - Neutral-Grip Pulldown", "2 ramp sets", "~40% of working weight x 12 -> ~70% x 5 -> working sets."]}, {"t": "sec", "x": "EVERYTHING AFTER EXERCISE 1"}, {"t": "row", "v": ["Exercises 2-4 (upper)", "1 feeler set", "~50% of working weight x 8, easy tempo, then straight into working sets. The muscles are already warm; this just grooves the movement and confirms the weight feels right today."]}, {"t": "row", "v": ["Exercise 5 (the leg slot)", "1-2 feeler sets", "Legs have been resting while you trained upper, so give them slightly more: ~40% x 10, then ~70% x 5 on Smith squat / RDL / leg press before working sets. Bulgarian split squats: one easy bodyweight set of 8 per leg is enough."]}, {"t": "row", "v": ["Feeling stiff or cold that day?", "Add, don't skip", "Extra ramp sets are always allowed - they cost 2 minutes and buy performance. Cutting warm-up to save time is the one shortcut this programme forbids; use the quick session version instead."]}]}, {"n": "Form Guide", "b": [{"t": "note", "x": "Universal rules: (1) The target muscle should be what fatigues and pumps - if a set of lateral raises tires your traps or a row tires your biceps first, form is off. (2) Control the lowering phase (~2s down) - if you can't, the weight is too heavy. (3) Once a week, prop your phone against a bottle and film one set from the side - the single best no-mirror tool. (4) Same setup every time (seat height, foot position, grip width) so your log numbers stay comparable."}, {"t": "sec", "x": "MONDAY - PUSH A"}, {"t": "row", "v": ["Overhead Press", "SETUP: Bar at upper-chest height in the rack. Grip just outside shoulders, forearms vertical under the bar. Bar rests on the heel of the palm, wrists straight. Feet hip-width, glutes and abs squeezed hard (this is your 'belt').\nEXECUTION: Big breath, brace, press the bar up and slightly BACK so it finishes over the back of your head - push your head 'through the window' once the bar passes your face. Lock out with biceps by your ears. Lower under control to collarbone level.", "FEEL CHECKS: At lockout, the bar should feel WEIGHTLESS and balanced over your mid-foot - if you have to fight it forward, it's drifting. Your glutes should be burning slightly from the squeeze. Shoulders and upper chest do the pushing; the first thing to fatigue should be your delts, then triceps. You should feel your ribs stay DOWN (abs on), not flared up.", "RED FLAGS: Lower-back pinch or arching feeling = you're leaning back to cheat, drop the weight. Bar path scraping way in front of your face = it will feel heavy at lockout. Wrist ache = bar sitting in fingers, not palm heel."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Cable Lateral Raise", "SETUP: Pulley at the LOWEST setting (ankle level). Cable at the LOWEST setting (or ankle height), stand side-on, handle in the far hand so the cable runs across your body. Slight lean away from the stack, holding the frame with the free hand.\nEXECUTION: Lead with the ELBOW, raise the arm out to the side in an arc until the elbow reaches shoulder height. Elbow stays slightly bent and always HIGHER than the wrist - pour-the-jug tilt. Lower over 2 full seconds all the way across your body for the deep stretch.", "FEEL CHECKS: Tension should be there from the very BOTTOM of the rep (that's the whole point of the cable). The burn should live on the SIDE cap of the shoulder - touch it between sets; it should be pumped and warm. Reps 12–18 should genuinely burn there. Your neck and traps should feel quiet - do a shrug after the set: if your traps feel pre-cooked, they were stealing the work.", "RED FLAGS: Feeling it on the FRONT of the shoulder = arm drifting forward, keep it in line with your torso. Shoulder-joint pinch at the top = raise only to shoulder height, not above, and keep the pinky-down tilt gentle. Needing a swing/hip bump to start each rep = too heavy."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Incline DB Press", "SETUP (chest not firing? see Setup Answers tab): Bench at 30 degrees. Pin shoulder blades BACK and DOWN and keep them there. Bench at 30° (usually the first or second incline notch - NOT 45°, which shifts to front delts). Dumbbells on knees, kick them up one at a time as you lie back. Shoulder blades pulled back and down, pinned to the bench. Slight arch, feet planted.\nEXECUTION: Lower the DBs to the OUTSIDE of your upper chest, elbows ~45° from your torso (not flared to 90°). Deep stretch at the bottom - DBs roughly level with your chest. Press up and slightly together without clanking them.", "FEEL CHECKS: The stretch at the bottom should be felt ACROSS your upper chest, like the muscle is being pulled wide. Squeeze test: at the top, you should be able to feel your upper pecs contract hard (tap them with a free rep after the set). Shoulder blades should stay pinched the whole set - if you feel them 'un-pin' and roll forward at the bottom, reset. Chest fatigues first, then front delts and triceps.", "RED FLAGS: Front-of-shoulder soreness dominating = bench too steep or elbows flaring. Wobbling/uneven pressing = one side weaker - that's fine, but stop the set when the weak side breaks form. Bottom of the rep feels pinchy in the shoulder = shorten the depth slightly."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Overhead Cable Triceps Extension", "SETUP: Low pulley, back to the stack, split stance, torso hinged 30-45 degrees, upper arms by the ears. Rope on a low-to-mid pulley. Grab the rope, turn away from the stack, and step forward into a staggered stance, leaning your torso ~30° forward. Elbows up beside your ears, pointing away from the stack, hands behind your head.\nEXECUTION: Keeping the UPPER ARMS FROZEN in place, extend the forearms until arms are straight, then let the weight pull your hands slowly back behind your head into a deep stretch. The elbows never drop or flare - only the forearm hinges.", "FEEL CHECKS: The stretch behind your head is everything - each rep should feel like a genuine PULL down the back of your upper arm (that's the long head lengthening). At lockout, the back of the arm should cramp-squeeze. Place your free moments on it: the meaty inner-back portion of the upper arm should pump up. If your elbows stay pinned, you'll feel work ONLY behind the arm - nowhere else.", "RED FLAGS: Feeling it in the shoulders or lats = elbows drifting down as you get tired; reset them high. Elbow-joint ache (not muscle) = ease the depth of the stretch and warm up with a light set of 20. Torso swinging forward-back to move the weight = too heavy."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Smith Squat (feet forward)", "SETUP: Bar at mid-chest height, safety stops just below your bottom position. Bar on the muscle of the upper traps, not the neck. Feet 20-30 cm in front of the bar, shoulder-width, toes slightly out.\nEXECUTION: Unhook, brace, lower for 2-3 seconds until thighs are at least parallel. Knees travel forward over the toes, heels stay down. Drive up through mid-foot, stop just short of locked knees.", "FEEL CHECKS: Stretch down the front of the thighs at the bottom, quads burning by the last reps. Weight spread over the whole foot. Your back leans into the bar like a backrest; your hands only steady it and never lift.", "RED FLAGS: Heels lifting = move the feet a little further forward. Arms working = too heavy or feet too far forward. Lower-back pressure = hips tucking under at the bottom, cut the depth slightly."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "sec", "x": "TUESDAY - PULL A"}, {"t": "row", "v": ["Weighted Pull-up / Wide Lat Pulldown", "SETUP: Grip just outside shoulder width, palms forward. Start from a DEAD HANG - arms fully straight, shoulders unshrugged (pull the shoulder blades slightly down first: 'proud chest, long neck').\nEXECUTION: Think 'drive the ELBOWS down into my back pockets', not 'pull with the hands'. Chest travels up toward the bar, slight lean back. Top = chin over bar (or bar to upper chest on pulldown). Lower over 2–3 seconds to a full hang every rep.", "FEEL CHECKS: THE key check: before rep 1, do the scapular set (blades down) - you should feel the sides of your back, under the armpits, switch ON. That tension should stay all set. After the set, the sore/pumped zone should be the outer back 'wings', not the arms. Grip a lat with the opposite hand mid-set if unsure - it should be rock hard. Full-hang check: at the bottom you should feel a stretch along the whole side of your back.", "RED FLAGS: Biceps and forearms failing before your back = you're arm-pulling; slow down and re-cue the elbows. Shoulders riding up by your ears at the bottom = you've lost the scapular set. Kipping/swinging = reduce added weight or switch to pulldowns until strict reps are there."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["DB Chest-Supported Row (incline bench)", "SETUP: Incline bench at 30-45 degrees. Lie face down, chest at the top edge of the pad, chin just over it. Balls of the feet planted behind you. DBs hang straight down, palms facing each other.\nEXECUTION: Pull the elbows back toward the hips, about 45 degrees from the body (elbows to back pockets). Squeeze the blades for 1 second, lower for 2 seconds, let the blades spread at the bottom.", "FEEL CHECKS: The pad is your form checker: if your chest lifts off it, you cheated. Mid-back and rear shoulders tire first, biceps only assist. Stretch across the mid-back at the bottom of every rep.", "RED FLAGS: DBs hitting the bench frame = raise the incline a notch. Biceps failing first = you are pulling with the hands, drag the elbows instead. Benches all taken = single-arm DB row, hand and knee on a flat bench, back flat."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Cable Lat Pullover", "SETUP: Rope or straight bar on the HIGH pulley. Face the stack, step back a metre, hinge your torso ~30–45° forward, arms extended up toward the pulley. Soft elbows, fixed for the whole set.\nEXECUTION: With arms nearly straight, pull the attachment DOWN in an arc to your thighs using only the shoulders - like doing a swimming pull. Return slowly, letting the weight pull your arms overhead until you feel a deep stretch under the armpits.", "FEEL CHECKS: This is the easiest lat exercise to verify by feel: at the top you MUST feel a stretch running from your armpit down the side of your ribs. If you feel that stretch, you're doing it right - full stop. At the bottom, squeeze your upper arms against your sides; the 'wing' under the armpit should be contracting hard. Zero biceps involvement - arms are rigid levers.", "RED FLAGS: Feeling it in the triceps = elbows are bending and straightening; lock the elbow angle. Feeling it in the lower back = you're heaving with the torso; the torso angle stays frozen, only the arms move. No armpit stretch at the top = step further from the stack."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Incline DB Curl", "SETUP: Bench at ~45–55°. Sit back fully, head and upper back ON the bench, dumbbells hanging straight down at your sides - arms BEHIND your torso line. This hang is the whole point.\nEXECUTION: Curl both DBs up WITHOUT letting the elbows drift forward - they stay pointing at the floor. Squeeze at the top (hands end up roughly shoulder height, not at your shoulders). Lower over 2–3 seconds to a complete dead hang and a strong biceps stretch.", "FEEL CHECKS: Bottom position check: you should feel a distinct STRETCH down the front of the upper arm at the dead hang - if there's no stretch, your elbows have crept forward. Keep your upper arms brushing the bench edge / your torso as a physical position reference you can feel. Biceps should burn deep and high (near the shoulder end) - that's the lengthened long-head work, exactly what we paid for.", "RED FLAGS: Shoulder-front ache = elbows drifting up/forward as you fatigue; end the set. Head lifting off the bench and shoulders rolling = you're heaving; drop 2kg. No stretch feeling at the bottom = check the bench angle isn't too upright."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Romanian Deadlift", "SETUP (form breaking with weight? do the two-week hinge regression on the Setup Answers tab first): Bar (or DBs) at hip height. Grip just outside thighs. Stand tall, feet hip-width, knees SOFT (slightly bent, then frozen at that bend). Shoulders back, chest proud.\nEXECUTION: Push your HIPS straight BACK as if closing a car door with your bum - the bar slides down your thighs, staying in contact with your legs the whole way. Torso hinges forward with a FLAT back. Stop at mid-shin or when your hamstrings say stop. Drive hips forward to stand, squeezing glutes at the top.", "FEEL CHECKS: The rep is governed by one sensation: hamstring stretch. Lower ONLY until you feel a strong pull down the back of your thighs, then reverse - that's your depth, wherever it lands. Bar-on-legs check: if the bar loses contact with your thighs/shins, you'll feel the lower back load up instantly - that's your cue it drifted. Flat-back check: your chest stays 'proud' and you could balance a cup on your lower back. Next-day soreness should be hamstrings and glutes, NOT lower back.", "RED FLAGS: Lower-back pump/ache during the set = back rounding or bar drifting away; reduce depth and weight. Feeling it in the knees/quads = knees are bending as you lower (that's a squat, not a hinge); freeze the knee angle."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "sec", "x": "THURSDAY - PUSH B"}, {"t": "row", "v": ["Seated DB Shoulder Press", "SETUP: Seat at 75-85 degrees (one notch back from upright). Bench upright (or one notch back). DBs kicked up to shoulder height, palms forward or slightly turned in, forearms vertical under the DBs. Back against the pad, feet planted, ribs down.\nEXECUTION: Press both DBs up and very slightly together to a full lockout overhead - biceps near ears. Lower under control until the DBs are level with your ears/upper jaw (a bit below is fine if the shoulders are happy).", "FEEL CHECKS: Forearm-vertical check by feel: the DB should feel BALANCED on the stacked forearm, not tipping - any tipping means the elbow isn't under the wrist. At the bottom you should feel mild stretch across the shoulders; at the top, delts squeezing. The pad tells you about cheating: if your lower back peels off it, you're arching to press - you'll feel the gap.", "RED FLAGS: Lower-back arch (gap behind you) = weight too heavy. Pinchy joint feeling at the bottom = don't lower as deep; stay just below ear level. One DB always lagging = start every set with the weaker side's pace."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["DB Lateral Raise", "SETUP: DBs at your sides, slight forward hinge (~10–15°), soft elbows, pinky side of the DB tilted very slightly down ('pouring water').\nEXECUTION: Raise both arms out to the SIDE in a wide arc, leading with the elbows, to shoulder height. Pause a beat. Lower over 2 full seconds - the lowering is half the exercise.", "FEEL CHECKS: Same target check as the cable version: side-cap burn, quiet traps. A trick that works blind: before the set, actively push your shoulder blades DOWN (as if putting them in your back pockets) and keep them there - traps physically can't shrug if the blades stay down, and you'll feel it if they try. The last 3–4 reps should burn on the outside of the shoulder specifically.", "RED FLAGS: DBs swinging and torso bouncing = too heavy - lateral raises respond to strictness, not load; going lighter GROWS the delts faster here. Neck tightening = shrugging; re-set blades down. Wrists above elbows at the top = you're lifting the hands, not the elbows."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Dips (chest-leaning)", "SETUP - INJURY RULE: never below upper-arms-parallel; rebuild on the assisted machine first (Setup Answers tab). Bars roughly shoulder-width. Jump to a straight-arm support, then LEAN the torso forward ~20–30° and let the shins drift back/knees bend - the lean is what shifts work to the chest.\nEXECUTION: Bend the elbows and lower until your upper arms are about parallel to the floor / you feel a solid chest stretch. Elbows track back and slightly out, not flared wide. Press back up to a hard lockout - the lockout is the triceps' moment.", "FEEL CHECKS: Depth by feel: descend until you feel the stretch across the LOWER CHEST - that's parallel, stop there. Lean check: if you feel the work in your chest, you're leaning enough; if it's all triceps and front shoulder, your torso has gone vertical - nose over the floor in front of the bars, feet behind you. Shoulder check at the bottom: no pinching in the front of the shoulder; if there is, cut depth by an inch.", "RED FLAGS: Sternum click or front-shoulder pinch = too deep or elbows flared; shorten ROM. Shaking/uncontrolled descent = do slow negatives or use the assisted dip machine until 8 clean reps. Swinging legs = cross the ankles and squeeze glutes."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Cable Rope Pushdown", "SETUP: Rope on the TOP pulley setting. Rope on the high pulley. Stand a half-step back, slight forward lean, elbows PINNED to your sides - imagine a £20 note trapped between each elbow and your ribs for the whole set.\nEXECUTION: Push the rope down until arms are fully straight, spreading the rope ends apart at the bottom and squeezing for a beat. Let the forearms rise under control until they're a bit above parallel - elbows never move from your sides.", "FEEL CHECKS: The pinned elbows ARE the feel-check: you can literally feel whether the elbow has stayed glued to your ribs. Full-lockout squeeze: at the bottom, the horseshoe on the OUTER upper arm should contract hard - tap it with the other hand on your last rep; it should be solid. Only the forearms should feel like they're moving.", "RED FLAGS: Shoulders rounding forward and torso crunching down = you're using bodyweight; lighten the stack. Elbows drifting forward on the way down = the lats/shoulders are helping; that's the £20 note falling. Wrist ache = grip the rope with wrists straight, not curled."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Leg Press", "SETUP: Sit fully back in the seat, LOWER BACK and hips glued to the pad. Feet on the platform slightly lower than centre, shoulder-width, toes a touch out.\nEXECUTION: Lower the platform under control until the knees reach roughly 90° or a touch deeper - stopping the moment your hips start to lift or tuck. Press through the whole foot to just short of locked knees. Never slam into lockout.", "FEEL CHECKS: The tailbone rule is your blind depth gauge: the instant you feel your bum start to peel or tuck off the pad, that's YOUR bottom - memorise that depth. Quad stretch at the bottom, quad burn on the way up, especially above the knees. Whole-foot pressure - if your heels float you'll feel the pressure move to the balls of your feet (bad for the knees).", "RED FLAGS: Lower-back pressure at depth = going too deep for your hips; shorten ROM. Knees caving in (pressure rolling to inside foot edge) = push the knees out over the toes. Locking out hard with a jolt = keep a soft knee at the top; tension stays on the quads anyway."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "sec", "x": "FRIDAY - PULL B"}, {"t": "row", "v": ["Neutral-Grip Lat Pulldown", "SETUP: Neutral (palms-facing) handles or V-grip attachment. Knees snug under the pad, arms fully extended overhead, slight lean back (~15°), chest up.\nEXECUTION: Set the blades down first, then drive the elbows down toward your hips, pulling the handle to the top of your chest. Squeeze, then let the weight pull your arms all the way overhead - feel your shoulder blades rise and the lats stretch at the top of every rep.", "FEEL CHECKS: Identical verification to Tuesday's pull-up: armpit-line tension on, arms as hooks. Top-of-rep stretch check: each rep should END with that pulled-taut feeling down the sides of your back - if reps start feeling 'short', you've stopped going all the way up. The lean stays fixed - if you feel yourself rowing backward for the last reps, the stack is too heavy.", "RED FLAGS: Forearm pump ending the set = death-gripping; hook the fingers, relax the thumbs (or use straps). Bar pulled to the stomach = you've turned it into a row; it should land at the collarbone/upper chest. Bouncing the stack = no stretch happening at the top."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Seated Cable Row (wide)", "SETUP: Sit so the stack is already lifted a few cm at full arm stretch. Wide bar or long handle. Feet on the plate, knees soft. Sit TALL - torso vertical, chest proud. Arms extended, feeling a stretch in the mid-back before rep one.\nEXECUTION: Pull the bar WIDE to the upper abdomen/lower chest, elbows out at ~45–60°, squeezing the blades together hard at the back. Return slowly, letting the blades slide apart and the torso stay vertical (a few degrees of natural sway max).", "FEEL CHECKS: Vertical-torso check by feel: your torso angle at the START and END of each rep should be identical - if you notice yourself further back after 5 reps, you're leaning. Squeeze check: 1-second blade pinch every rep; you should be able to hold a pencil between your shoulder blades at the back. Mid/upper back fatigues; rear shoulders join in; biceps are passengers.", "RED FLAGS: Lower back tiring first = torso heaving; reduce weight, sit taller. Shoulders rolling forward at the stretch = fine, but don't let the LOWER back round with them. Jerky yanks off the stack = pull with a smooth 1s tempo."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Face Pull", "SETUP: Rope at UPPER-CHEST-to-eye height. Grab the rope ends with thumbs pointing back toward you (underhand-ish). Step back into a split stance until the stack is lifted.\nEXECUTION: Pull the rope toward your EYES/forehead, elbows high and wide, splitting the rope ends apart so your hands finish beside your ears - end position looks like a double-biceps pose. Pause 1s. Return slowly.", "FEEL CHECKS: End-position self-test: at the peak, your knuckles should be beside your EARS and you should feel a squeeze BETWEEN and BELOW the shoulder blades plus the back of the shoulders. If the pull lands at your chin/chest, you'll feel it in the biceps instead - that's the tell. This should never feel 'heavy' - it should feel like a controlled squeeze. Go lighter than pride wants.", "RED FLAGS: Biceps doing the work = pulling with hands low; raise the elbows and think 'pull apart', not 'pull back'. Leaning back to move the stack = too heavy. Neck jutting forward to meet the rope = keep the head still, bring the rope to YOU."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Hammer Curl", "SETUP: DBs at your sides, palms facing your thighs (neutral) and staying neutral throughout. Stand tall, elbows lightly touching your sides.\nEXECUTION: Curl the DB up in an arc to shoulder height, thumb leading, elbow staying put by your side. Squeeze, lower over 2s to a full hang. Alternate arms or both together.", "FEEL CHECKS: The elbow-on-ribs contact is your form sensor - you can feel it drift if it happens. The pump should sit LOWER and more outside than a normal curl: the outer upper arm (brachialis, between biceps and triceps) and the top of the forearm should thicken up. Grip the working arm with the free hand mid-set: the muscle just outside the biceps should be hard.", "RED FLAGS: Elbows swinging forward turning it into a front raise = lighter weight. Body rocking to start reps = brace the glutes or do them seated. Wrist curling inward at the top = keep the wrist dead straight, thumb up."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}, {"t": "row", "v": ["Bulgarian Split Squat", "SETUP: Rear foot laces-down on a bench, front foot a LONG stride ahead (you'll adjust - see feel check). DBs at your sides or one goblet-style. Slight forward torso lean.\nEXECUTION: Lower straight down until the rear knee nearly touches the floor and you feel a deep stretch in the front thigh/glute. Drive up through the FRONT heel/mid-foot. All reps one side, then switch - always start with the weaker leg.", "FEEL CHECKS: Stride-length calibration by feel: if you feel it mostly in the front QUAD and your front heel wants to lift, the stance is too short. If you feel a big GLUTE/hip stretch and the heel stays heavy, you've found the long stride we want. Balance is a feature: wobbling means the stabilisers are working; it should improve week to week - that's measurable progress you can feel. Front leg does ~80% of the work; the back leg is a kickstand.", "RED FLAGS: Rear-hip-flexor pinch (front of the back leg's hip) = rear foot too high or stride too short. Front-knee pain = knee diving inward; feel for pressure on the inside edge of the foot and push the knee out. Using the back leg to spring up = keep it passive."], "h": ["Exercise", "Setup & Execution", "How to know it's RIGHT (feel checks - no mirror)", "Red flags (what 'wrong' feels like)"]}]}, {"n": "Setup Answers", "b": [{"t": "sec", "x": "EQUIPMENT & SETTINGS"}, {"t": "row", "v": ["Chest-supported row: no machine?", "Use DB chest-supported rows. Incline bench at 30-45 degrees, lie chest-down with your chest at the top of the pad, feet planted, DBs hanging straight down. Row to the hips, elbows about 45 degrees from the body, one second squeeze. Same rule as the machine: if your chest lifts off the pad, you cheated."]}, {"t": "row", "v": ["Incline treadmill for warm-up", "8-12% gradient at 5-6 km/h. Warm and slightly breathless after 3-4 min, still able to talk."]}, {"t": "row", "v": ["Gym is a 5 min walk: run there?", "No. A BRISK 5 min walk already counts as the pulse raiser, so skip the treadmill. It replaces step 1 only: still do arm circles, pull-aparts, squats and the dead hang inside. Cold night: add 2 min on the bike."]}, {"t": "row", "v": ["Seated DB press seat angle", "75-85 degrees, i.e. one notch back from fully upright. Dead vertical clashes the DBs with your head and cramps the shoulder; below 70 degrees it becomes an incline press."]}, {"t": "row", "v": ["Rope pushdown pulley height", "Top setting, above head height."]}, {"t": "row", "v": ["Cable lateral raise pulley height", "Lowest setting, ankle level. Stand side-on so the cable runs across the front of your body; start with the hand slightly across your thigh."]}, {"t": "row", "v": ["Seated cable row: how far from the handle", "Sit so that with arms fully stretched forward the weight stack is already lifted a few cm off the rest. If the plates touch down at full stretch you are too close: shift back. Knees slightly bent, feet flat on the platform."]}, {"t": "row", "v": ["Smith squat foot position (hack squat sub)", "Feet 20-30 cm in front of the bar line, shoulder-width. Leaning your back into the bar is CORRECT - the bar is your backrest, that is what makes it hack-squat-like. What is wrong is arms pulling: hands only steady the bar, never lift. If you feel your arms working, bring feet back to ~15 cm forward and drop the weight."]}, {"t": "row", "v": ["Overhead triceps: body position", "Rope on the LOW pulley. Grab it, turn your back to the stack, step one foot forward into a split stance. Hinge the torso forward 30-45 degrees, flat back, leaning away from the stack. Upper arms up beside the ears pointing forward along the torso line, hands behind the head. Only the forearms move; upper arms never drift down or flare."]}, {"t": "sec", "x": "FORM FIXES"}, {"t": "row", "v": ["Never feel chest on presses", "Front delts and triceps are taking over. In order of impact: (1) Pin shoulder blades BACK and DOWN into the bench and keep them there all set - this is 80% of the fix. (2) Bench at 30 degrees, not 45. (3) Elbows 45 degrees from the torso, not flared to 90. (4) Lower DBs to the upper-chest line, not the shoulders. (5) Stop just short of lockout so the chest never rests. (6) Think SQUEEZE THE DBs TOGETHER on the way up, not push up - squeezing inward is the chest's job. Then drop the weight 20%, 3 seconds down. One light set of cable flys or slow push-ups before pressing wakes the chest up."]}, {"t": "row", "v": ["Lead with the elbow (lateral raise)", "Imagine a string tied to your elbow pulling it up and out to the side; the hand just follows underneath. At the top the elbow is the highest point of the arm, wrist a little lower. Self-check: hand higher than elbow at the top = you led with the hand = front delt and trap movement. To find it: bend the elbow to 90 degrees with no weight and raise only the elbow to shoulder height. That is the feeling. Then straighten most of the way and add weight."]}, {"t": "row", "v": ["RDL: form breaks with any weight", "The hinge is not grooved yet, so weight exposes it. Two-week regression: (1) Broomstick drill - stick along the spine touching back of head, upper back and tailbone; hinge back keeping all three contacts, 10 reps, no weight. If any point leaves the stick, that is the rounding. (2) Wall drill - stand a foot from a wall, push hips back until the bum touches it, knees soft and frozen. (3) Then RDLs with 8-10 kg DBs, only to knee height, DBs dragging on the thighs. For those two weeks do seated leg curls as the Tuesday leg slot and practise the hinge after as a bonus. Reintroduce the loaded RDL when the drill feels automatic."]}, {"t": "row", "v": ["Dips after a pec injury (READ THIS)", "Going too low is exactly how pecs get strained on dips. HARD RULE: upper arms parallel to the floor and NO LOWER, ever - the shoulder never drops below the elbow. Also: elbows track back not out; shoulders stay DOWN away from the ears at the bottom (shrugging up is the injury position); lean 20-30 degrees, not more; 2-3 seconds down. Rebuild path: weeks 1-4 assisted dip machine only with the depth cap, up to 3 x 10; no assisted machine = close-grip bench press instead. Then bodyweight dips with the cap. Any pinch or pull in the pec or front shoulder: stop the set, swap to bench. Honest note: dips are the highest-risk lift in the programme for you specifically and are not essential. Close-grip bench permanently is a fine choice."]}, {"t": "sec", "x": "NOVEMBER 2026 ANSWERS"}, {"t": "row", "v": ["Can't hit the minimum reps", "Reduce the weight 5-10%. Only reduce if the FIRST set misses the range; if set 1 is in range and set 3 falls one rep short, keep the weight (normal fatigue)."]}, {"t": "row", "v": ["Can't hit the minimum on pull-ups", "Reduce the load by adding assistance. 3-5 clean reps: do them, then finish the set on the assisted machine or with a band under the knee until you reach 6-10 total. Fewer than 3: lat pulldowns are the 3 working sets, plus 2 sets of 3 slow negatives (jump to the top, lower for 5 s). At 3 x 6 bodyweight, pull-ups become the main lift."]}, {"t": "row", "v": ["RDL wall drill with a barbell", "Yes. Stand one foot-length from the wall with an empty bar (lighter fixed barbell if 20 kg breaks form). Push the hips back until the bum lightly taps the wall, bar sliding down the thighs. Tap, don't sit into it. Move a few cm further away as it gets easy, then drop the wall."]}, {"t": "row", "v": ["Rest during warm-ups", "General warm-up: no rest, flow through. Ramp sets: 30-60 s (time to change the weight). After the last ramp set: 90 s to 2 min before the first working set. Feeler sets: 30-60 s, then start."]}, {"t": "row", "v": ["Still not feeling chest: 4-week fix", "Use the chest press machine in Monday's incline press slot for 4 weeks. Seat height so the handles line up with mid-chest (nipple line); handles at shoulder height make it a shoulder press. Blades back and down, chest lifted, elbows slightly below shoulder level. Stop just short of lockout, shoulders never roll forward, 3 s lowering, 1 s pause in the stretch, 10-12 controlled reps. Touch test: press one arm at a time, free hand on the working pec; it should harden. If not, lower the seat or pull the blades back more. Fly machine busy: one light set of 15 cable flys first (pulleys at chest height, hug-a-tree arms). A muscle can grow without a strong feel; next-day soreness in the chest is the real test."]}, {"t": "row", "v": ["Band pull-aparts", "Light band at chest height, straight arms, hands shoulder-width, band just taut (no slack, no real stretch). Pull apart until the band touches the chest and the arms make a T, squeeze 1 s, return over 2 s. Shoulders down, no leaning back. Right tightness: 15 reps with the last few burning between the shoulder blades. Can't reach the chest = widen the grip. Too easy = narrow the grip or double the band."]}, {"t": "row", "v": ["Cable lateral raise, step by step", "1) Lowest pulley, single handle, lightest 1-2 plates. 2) For the right arm, stand with your LEFT side toward the machine, one step away. 3) Handle in the right hand, cable across the front of the thighs, left hand on the frame. 4) Start with the right hand in front of the left thigh, elbow slightly bent. 5) Raise out to the side and slightly forward (pointing at 2 o'clock), elbow rising first, to shoulder height. 6) Pause, lower 2-3 s back across the body, torso still. 7) Turn around for the left arm. Still awkward: DB lateral raises on both days is fine."]}]}, {"n": "Session Guide", "b": [{"t": "sec", "x": "EXERCISE ORDER"}, {"t": "row", "v": ["Do them in the numbered order", "The 1–5 numbering on the Programme sheet IS the running order. Exercises done earlier in a session get better performance and slightly better growth because you're freshest - so the order encodes your priorities."]}, {"t": "row", "v": ["Why this order", "1) Heaviest compound first (OHP, pull-up, presses, pulldown): most technically demanding, riskiest when tired, biggest loads - it gets you at 100%. 2) Priority V-taper isolations second/third (lateral raises, pullovers): the actual goal muscles get near-fresh slots. 3) Arm isolations fourth: elbow-only movements perform fine after back/chest work, and the arms are pre-warmed by then. 4) Leg compound last - deliberate: legs are the secondary goal, so they absorb the fatigue cost. Hack squats last are still brutally effective; hack squats FIRST would tax your whole system before the work you care most about."]}, {"t": "row", "v": ["The one legal swap", "If a leg lift suffers too much at slot 5 (e.g., RDL form getting sloppy), move it to slot 3 that day. Order protects your priorities - the numbering already encodes them."]}, {"t": "sec", "x": "REST TIMES"}, {"t": "row", "v": ["Big compounds: 2–3 min", "OHP, pull-ups/pulldowns, incline & DB presses, dips, rows, Smith squat, RDL, leg press. Don't rush these - under-resting costs reps, and reps are the currency of double progression."]}, {"t": "row", "v": ["Isolations: 1.5–2 min", "Lateral raises, curls, triceps work, face pulls, pullovers."]}, {"t": "row", "v": ["Time-saving superset (optional)", "Pair an arm isolation with the leg exercise - e.g., hammer curls during Bulgarian split squat rests. They share zero muscles, so nothing is lost. This is the only shortcut worth taking."]}, {"t": "sec", "x": "WARM-UP"}, {"t": "row", "v": ["General: ~5 min", "Anything that raises your heart rate and warms the joints - brisk incline walk, rower, arm circles/band pull-aparts."]}, {"t": "row", "v": ["Specific: ramp into exercise 1 only", "2–3 progressively heavier sets before your working sets on the FIRST exercise. Example for OHP: empty bar × 10 → 50% × 6 → 75% × 3 → working sets. Same pattern for pull-ups (band-assisted or pulldown ramp) and any first lift."]}, {"t": "row", "v": ["Everything after exercise 1", "You're already warm - one light feeler set (~50% × 8) is enough before the working sets of each remaining exercise."]}, {"t": "sec", "x": "WEEK 1 TIP"}, {"t": "row", "v": ["Start deliberately light", "Run week 1 at ~60–70% of what you could do and use the sessions purely to lock in the feel checks on the Form Guide tab. The weights are forgiving while you bank the form knowledge - double progression catches you up to real loads by week 3 anyway."]}]}, {"n": "Time-Capped Sessions", "b": [{"t": "note", "x": "A1/A2 and B1/B2 mean supersets: do a set of A1, rest ~45-60s, set of A2, rest ~45-60s, repeat until all sets done, then move to the B pair. Pairs share no muscles, so nothing is lost. Quick sessions compensate for lost volume with effort: every set to 0-1 RIR. Rule of thumb: full session when fresh, 60-min when normal, quick when tired or time-poor. Any version counts as the session in your log - never skip because only the quick one fits."}, {"t": "sec", "x": "HOW LONG IS EACH VERSION?"}, {"t": "row", "v": ["Full programme (as written)", "60-75 min", "15 sets, full rests, all 5 exercises", "Best total stimulus. Use when energy and time allow."]}, {"t": "row", "v": ["60-minute version", "~55-60 min", "Same 5 exercises, tightened rests, exercises 4+5 supersetted", "Loses almost nothing - the research supports antagonist/unrelated supersets as stimulus-neutral time savers."]}, {"t": "row", "v": ["Quick version", "~30-35 min", "4 exercises, 3 sets each, fully supersetted, 0-1 RIR", "Keeps ~70-80% of the stimulus. The day's lowest-priority exercise is dropped, never the V-taper slots."]}, {"t": "sec", "x": "THE 60-MINUTE VERSION (all 4 days)"}, {"t": "row", "v": ["Changes from full", "Rest caps: compounds 2:00, isolations 1:15-1:30", "Superset exercise 4 + exercise 5 (arm isolation + leg compound share nothing)", "Warm-up ramp on exercise 1 only; single light feeler set elsewhere. Timed rests on your phone - drift is where the extra 15 min hides."]}, {"t": "row", "v": ["Example: Monday at 60", "OHP 3 sets (2:00 rests)", "Lateral Raise, Incline Press (1:15-1:30 rests)", "A1 Overhead Triceps Ext / A2 Smith Squat supersetted to finish"]}, {"t": "sec", "x": "QUICK VERSIONS (~30 MIN) - 3 sets each, all to 0-1 RIR"}, {"t": "row", "v": ["Monday Quick", "A1 Overhead Press / A2 Smith Squat", "B1 Cable Lateral Raise / B2 Overhead Triceps Ext", "Dropped: Incline Press (chest is the day's lowest priority; presses elsewhere cover it)"]}, {"t": "row", "v": ["Tuesday Quick", "A1 Weighted Pull-up / A2 Romanian Deadlift", "B1 Cable Lat Pullover / B2 Incline DB Curl", "Dropped: DB Chest-Supported Row (Friday's row covers thickness; width slots survive)"]}, {"t": "row", "v": ["Thursday Quick", "A1 Seated DB Press / A2 Leg Press", "B1 DB Lateral Raise / B2 Rope Pushdown", "Dropped: Dips (pressing is covered; the lateral-delt and triceps slots are untouchable)"]}, {"t": "row", "v": ["Friday Quick", "A1 Neutral-Grip Pulldown / A2 Bulgarian Split Squat", "B1 Face Pull / B2 Hammer Curl", "Dropped: Seated Cable Row (Tuesday covered thickness; rear delts and arms stay)"]}, {"t": "sec", "x": "EMERGENCY 20-MINUTE VERSION"}, {"t": "row", "v": ["Any day", "Do only the A1/A2 pair + B1/B2 pair, 2 sets each instead of 3", "8 total sets, every one to 0 RIR", "This is the floor. Research is clear that a few very hard sets retain most of the stimulus - 20 minutes is never pointless."]}, {"t": "sec", "x": "ENERGY RULES (how the programme manages fatigue)"}, {"t": "row", "v": ["Built-in", "Hardest lift first, legs last to absorb fatigue", "Only 15 sets/session - no junk volume; fractional counting does the arm work for free", "Compounds capped at 1-2 RIR to protect recovery; deload every 8-9 weeks"]}, {"t": "row", "v": ["Evening training", "Eat carbs 60-90 min before the gym (banana, rice, oats with the pre-gym meal)", "Careful with caffeine: with a 9:30pm bedtime, avoid pre-workouts after ~2pm - sleep is the biggest anabolic lever you have", "Low-energy day = run the quick version, don't skip. The RIR system self-corrects loads on tired days: 2 RIR on a bad day is simply a lighter weight, and the log stays honest."]}]}, {"n": "Subs Ranked", "b": [{"t": "note", "x": "Rules of swapping: (1) Preserve the PATTERN and the MUSCLE-LENGTH BIAS - the 'must preserve' column is the contract; any exercise honouring it is a valid sub. (2) Prefer Sub 1 over Sub 2 over Sub 3. (3) Same sets × reps × RIR as the original. (4) Log substitutes on their own line in the Tracking Log - loads don't transfer between variations. (5) An 'okay' exercise done consistently beats an optimal one skipped."}, {"t": "sec", "x": "PUSH EXERCISES"}, {"t": "row", "v": ["Overhead Press", "Seated DB Shoulder Press", "Machine Shoulder Press", "Landmine Press (half-kneeling)", "Heavy overhead pressing pattern. Machine version is fully valid - stability isn't the goal, delt tension is."], "h": ["Programme exercise", "Sub 1 (best)", "Sub 2", "Sub 3", "What every sub MUST preserve"]}, {"t": "row", "v": ["Cable Lateral Raise", "DB Lateral Raise", "Machine Lateral Raise", "Lean-away DB Lateral
